# Codecov configuration — design in docs/research/combined-coverage-codecov.md
# and the wayfinder map https://github.com/ndelangen/dunezone/issues/299.
# Statuses are informational by owner decision: coverage informs review,
# never gates a merge.

codecov:
  notify:
    # unit + publisher + e2e today; bump when the storybook flag lands.
    after_n_builds: 3

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: auto
        informational: true

flags:
  unit:
    carryforward: true
  publisher:
    carryforward: true
  e2e:
    carryforward: true

comment:
  after_n_builds: 3
  layout: "diff, flags, files"
