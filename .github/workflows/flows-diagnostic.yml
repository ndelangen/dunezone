# Diagnostic for #1322 (question 6): runs the hosted browser flows on CI repeatedly.
# It lives only on norbert/1322-flows-diagnostic, whose draft PR is closed unmerged,
# so it never becomes a required check.
name: Hosted flows diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flows-diagnostic-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.head_ref == 'norbert/1322-flows-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # The probes come first so they report early; the repeats interleave the shards.
        run: |
          entries='{"shard":"webgpu-probe","repeat":0},{"shard":"pixel-bite","repeat":0}'
          for repeat in $(seq 1 20); do
            for shard in regular catalogue protocol; do
              entries+=",{\"shard\":\"$shard\",\"repeat\":$repeat}"
            done
          done
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"

  flows:
    needs: plan
    name: ${{ matrix.shard }} ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Other PRs' CI keeps the rest of the concurrent runners.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Record the runner CPU
        run: |
          mkdir -p test-results/hosted-play
          {
            lscpu
            echo "nproc: $(nproc)"
            free -m
          } | tee test-results/hosted-play/lscpu.txt
      - name: Select full Chromium in new headless mode
        # An explicit executable keeps Playwright off chrome-headless-shell.
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Report the default WebGPU adapter
        if: matrix.shard == 'webgpu-probe'
        continue-on-error: true
        run: bun .github/diagnostic/webgpu-adapter.mjs "$CHROMIUM" test-results/hosted-play/webgpu-adapter-default.json
      - name: Wrap Chromium with SwiftShader WebGPU flags
        if: matrix.shard == 'webgpu-probe'
        run: |
          wrapper="$RUNNER_TEMP/chromium-webgpu"
          printf '#!/usr/bin/env bash\nexec %q "$@" --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader --disable-vulkan-surface\n' "$CHROMIUM" > "$wrapper"
          chmod +x "$wrapper"
          cat "$wrapper"
          echo "CHROMIUM=$wrapper" >> "$GITHUB_ENV"
      - name: Report the SwiftShader WebGPU adapter
        if: matrix.shard == 'webgpu-probe'
        continue-on-error: true
        run: bun .github/diagnostic/webgpu-adapter.mjs "$CHROMIUM" test-results/hosted-play/webgpu-adapter-swiftshader.json
      - name: Hide every spice stack (throwaway patch in this job only)
        if: matrix.shard == 'pixel-bite'
        run: |
          file=src/app/routes/_app/play/TabletopScene.tsx
          perl -0pi -e 's/(function SpiceLayers\(\{ piece \}: \{ piece: TablePiece \}\) \{\n  return \(\n    <group)>/$1 visible={false}>/' "$file"
          if git diff --quiet -- "$file"; then
            echo "The spice patch did not apply."
            exit 1
          fi
          git diff -- "$file" | tee test-results/hosted-play/pixel-bite.patch
      - name: Run the regular flow
        if: matrix.shard == 'regular' || matrix.shard == 'webgpu-probe' || matrix.shard == 'pixel-bite'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow regular --browser "$CHROMIUM"
      - name: Run public-controls and battles
        if: matrix.shard == 'catalogue'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow public-controls --flow battles --browser "$CHROMIUM"
      - name: Run the protocol verifier
        if: matrix.shard == 'protocol'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate
      - name: Keep the protocol boot's Worker log
        if: matrix.shard == 'protocol' && !cancelled()
        run: mv test-results/hosted-play/worker.log test-results/hosted-play/worker-protocol.log || true
      - name: Run private-banks and decks
        if: matrix.shard == 'protocol' && !cancelled()
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow private-banks --flow decks --browser "$CHROMIUM"
      - name: Summarise timing and renderer
        if: always()
        run: |
          {
            echo "### ${{ matrix.shard }} ${{ matrix.repeat }}: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
            echo '```'
            cat test-results/hosted-play/diagnostic-timing.jsonl 2>/dev/null || echo "no timing recorded"
            for report in test-results/hosted-play/browser/*/report.json; do
              if [ -f "$report" ]; then
                jq -c '{flow, renderer, failure}' "$report"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain hosted flow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flows-diagnostic-${{ matrix.shard }}-${{ matrix.repeat }}
          path: test-results/hosted-play/**
          if-no-files-found: warn
          retention-days: 14
