# Diagnostic for #1322 (question 6): runs the hosted browser flows on CI repeatedly.
# It lives only on norbert/1322-flows-diagnostic, whose draft PR is closed unmerged,
# so it never becomes a required check.
name: Hosted flows diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flows-diagnostic-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.head_ref == 'norbert/1322-flows-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # Second pass, after the twenty-repeat run 36261739729: probes that isolate the pixel check,
        # WebGPU presentation, and chrome-headless-shell against full Chromium.
        run: |
          entries='{"shard":"pixel-bite","repeat":1},{"shard":"pixel-control","repeat":1},{"shard":"webgpu-surface","repeat":0}'
          entries+=',{"shard":"pixel-bite","repeat":2},{"shard":"pixel-control","repeat":2}'
          for repeat in 1 2; do
            for shard in shell-regular shell-catalogue shell-protocol; do
              entries+=",{\"shard\":\"$shard\",\"repeat\":$repeat}"
            done
          done
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"

  flows:
    needs: plan
    name: ${{ matrix.shard }} ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Other PRs' CI keeps the rest of the concurrent runners.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Record the runner CPU
        run: |
          mkdir -p test-results/hosted-play
          {
            lscpu
            echo "nproc: $(nproc)"
            free -m
          } | tee test-results/hosted-play/lscpu.txt
      - name: Select full Chromium in new headless mode
        # An explicit executable keeps Playwright off chrome-headless-shell.
        if: ${{ !startsWith(matrix.shard, 'shell-') }}
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Wrap Chromium with SwiftShader WebGPU flags, keeping the Vulkan surface
        if: matrix.shard == 'webgpu-surface'
        run: |
          wrapper="$RUNNER_TEMP/chromium-webgpu"
          printf '#!/usr/bin/env bash\nexec %q "$@" --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader\n' "$CHROMIUM" > "$wrapper"
          chmod +x "$wrapper"
          cat "$wrapper"
          echo "CHROMIUM=$wrapper" >> "$GITHUB_ENV"
      - name: Run the spice round trip straight after seating (throwaway patch in this job only)
        if: matrix.shard == 'pixel-bite' || matrix.shard == 'pixel-control'
        run: |
          file=scripts/verify-hosted-play-browser.mjs
          perl -0pi -e "s/(\n  for \(const view of \['left', 'right', 'bottom', 'map'\]\) \{)/\n  await focus(a, 'map');\n  await focus(b, 'map');\n  await openTab(a, 'Table');\n  await sharedSpiceRoundTrip(a, b, 3, () => a.page.getByRole('button', { name: 'Spawn 3 spice', exact: true }).click(), 'spice-button-3');\n  return;\1/" "$file"
          if git diff --quiet -- "$file"; then
            echo "The reorder patch did not apply."
            exit 1
          fi
          git diff -- "$file" | tee test-results/hosted-play/spice-first.patch
      - name: Hide every spice stack (throwaway patch in this job only)
        if: matrix.shard == 'pixel-bite'
        run: |
          file=src/app/routes/_app/play/TabletopScene.tsx
          perl -0pi -e 's/(function SpiceLayers\(\{ piece \}: \{ piece: TablePiece \}\) \{\n  return \(\n    <group)>/$1 visible={false}>/' "$file"
          if git diff --quiet -- "$file"; then
            echo "The spice patch did not apply."
            exit 1
          fi
          git diff -- "$file" | tee test-results/hosted-play/pixel-bite.patch
      # CHROMIUM is empty for the shell- shards, so Playwright launches chrome-headless-shell.
      - name: Run the regular flow
        if: contains(fromJSON('["regular","shell-regular","webgpu-surface","pixel-bite","pixel-control"]'), matrix.shard)
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow regular ${CHROMIUM:+--browser "$CHROMIUM"}
      - name: Run public-controls and battles
        if: matrix.shard == 'catalogue' || matrix.shard == 'shell-catalogue'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow public-controls --flow battles ${CHROMIUM:+--browser "$CHROMIUM"}
      - name: Run the protocol verifier
        if: matrix.shard == 'protocol' || matrix.shard == 'shell-protocol'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate
      - name: Keep the protocol boot's Worker log
        if: (matrix.shard == 'protocol' || matrix.shard == 'shell-protocol') && !cancelled()
        run: mv test-results/hosted-play/worker.log test-results/hosted-play/worker-protocol.log || true
      - name: Run private-banks and decks
        if: (matrix.shard == 'protocol' || matrix.shard == 'shell-protocol') && !cancelled()
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow private-banks --flow decks ${CHROMIUM:+--browser "$CHROMIUM"}
      - name: Summarise timing and renderer
        if: always()
        run: |
          {
            echo "### ${{ matrix.shard }} ${{ matrix.repeat }}: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
            echo '```'
            cat test-results/hosted-play/diagnostic-timing.jsonl 2>/dev/null || echo "no timing recorded"
            for report in test-results/hosted-play/browser/*/report.json; do
              if [ -f "$report" ]; then
                jq -c '{flow, renderer, failure}' "$report"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain hosted flow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flows-diagnostic-${{ matrix.shard }}-${{ matrix.repeat }}
          path: test-results/hosted-play/**
          if-no-files-found: warn
          retention-days: 14
