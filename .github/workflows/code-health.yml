name: Code health

on:
  pull_request:
    paths:
      - "src/**"
      - "convex/**"
      - "workers/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "*mutation*"
      - "stryker.config.json"
      - ".semgrepignore"
      - ".github/workflows/code-health.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/code-health.yml"
      - ".semgrepignore"
      - "stryker.config.json"
      - "vitest.mutation.config.ts"
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Semgrep and mutation report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install Semgrep Community Edition
        run: python -m pip install semgrep==1.180.0
      - name: Scan source with community security rules
        id: semgrep
        run: |
          mkdir -p test-results/code-health
          semgrep scan --config p/security-audit --metrics=off --disable-version-check --strict --sarif --output test-results/code-health/semgrep.sarif src convex workers scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ !cancelled() }}
        id: node
        with:
          node-version: "24"
      - uses: ./.github/actions/setup
        if: ${{ !cancelled() }}
        id: dependencies
      - name: Check the isolated load guards with mutation testing
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bun run test:mutation
      - name: Publish security findings
        if: always() && steps.semgrep.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: test-results/code-health/semgrep.sarif
          category: semgrep-community
      - name: Retain code-health reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-health-${{ github.run_id }}
          path: test-results/code-health/
          if-no-files-found: warn
          retention-days: 14
