name: Code health

on:
  pull_request:
    paths:
      - "src/**"
      - "convex/**"
      - "workers/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "*mutation*"
      - "stryker.config.json"
      - ".semgrepignore"
      - ".github/workflows/code-health.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/code-health.yml"
      - ".semgrepignore"
      - "stryker.config.json"
      - "vitest.mutation.config.ts"
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Semgrep and mutation report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Semgrep Community Edition
        run: |
          python -m pip install --only-binary=:all: semgrep==1.180.0
      - name: Scan source with community security rules
        id: semgrep
        run: |
          mkdir -p test-results/code-health
          semgrep scan --config p/security-audit --metrics=off --disable-version-check --strict --sarif --output test-results/code-health/semgrep.sarif src convex workers scripts
      - uses: ./.github/actions/setup
        if: ${{ !cancelled() }}
        id: dependencies
      - name: Check the isolated load guards with mutation testing
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run test:mutation
      - name: Publish security findings
        if: always() && steps.semgrep.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: test-results/code-health/semgrep.sarif
          category: semgrep-community
      - name: Retain code-health reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-health-${{ github.run_id }}
          path: test-results/code-health/
          if-no-files-found: warn
          retention-days: 14
