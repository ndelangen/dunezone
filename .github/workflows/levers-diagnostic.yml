# Diagnostic for #1343 and #1322: measures five speed levers for the hosted browser flows against a control arm.
# It lives only on norbert/1343-diag-speed-levers, whose draft PR is closed unmerged,
# so it never becomes a required check.
name: Hosted flows speed levers

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: levers-diagnostic-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.head_ref == 'norbert/1343-diag-speed-levers'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # Arms interleaved within each repeat, so every arm meets the same mix of runner hosts.
        # The nosmooth arm isolates the pose smoothing lever; the protocol shard has one carry, so it skips that arm.
        run: |
          repeats=1
          entries=''
          for repeat in $(seq 1 "$repeats"); do
            for shard in regular catalogue protocol; do
              for arm in control all nosmooth; do
                if [ "$arm" = nosmooth ] && [ "$shard" = protocol ]; then
                  continue
                fi
                entries+="${entries:+,}{\"arm\":\"$arm\",\"shard\":\"$shard\",\"repeat\":$repeat}"
              done
            done
          done
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"

  flows:
    needs: plan
    name: ${{ matrix.arm }} ${{ matrix.shard }} ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Six at a time, so other PRs' CI keeps the rest of the concurrent runners.
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Doubled budgets in every arm, so control runs on the slowest hosts finish and can be compared.
      BUDGET: --diag-budget-scale 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Record the runner CPU and start vmstat
        run: |
          out=test-results/hosted-play
          mkdir -p "$out"
          {
            lscpu
            echo "nproc: $(nproc)"
            free -m
          } | tee "$out/lscpu.txt"
          nohup vmstat -n -t 2 > "$out/vmstat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/samplers.pid"
      - name: Select full Chromium in new headless mode
        # An explicit executable keeps Playwright off chrome-headless-shell, as in runs 36305597932 and 36317056421.
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          "$chromium_path" --version | tee test-results/hosted-play/chromium-version.txt
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Choose the arm's switches
        # all: two-step carries, 3 s cooldown, clipped polls, one boot per shard with the build overlapped, time-based pose smoothing.
        # nosmooth: the same without the pose smoothing build switch. control: none.
        run: |
          case "${{ matrix.arm }}" in
            control)
              echo "LEVERS=" >> "$GITHUB_ENV"
              ;;
            all)
              echo "LEVERS=--diag-carry-steps 2 --phase-cooldown-ms 3000 --diag-clip-polls --overlap-build" >> "$GITHUB_ENV"
              echo "VITE_DIAG_POSE_CAP=0.25" >> "$GITHUB_ENV"
              ;;
            nosmooth)
              echo "LEVERS=--diag-carry-steps 2 --phase-cooldown-ms 3000 --diag-clip-polls --overlap-build" >> "$GITHUB_ENV"
              ;;
            *)
              exit 1
              ;;
          esac
      - name: Run the regular flow
        if: matrix.shard == 'regular'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow regular --browser "$CHROMIUM" $BUDGET $LEVERS
      - name: Run public-controls and battles
        if: matrix.shard == 'catalogue'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow public-controls --flow battles --browser "$CHROMIUM" $BUDGET $LEVERS
      - name: Run the protocol verifier on its own boot
        if: matrix.shard == 'protocol' && matrix.arm == 'control'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate $BUDGET
      - name: Keep the protocol boot's Worker and Wrangler logs
        # The next launcher truncates worker.log and removes wrangler.log at start.
        if: matrix.shard == 'protocol' && matrix.arm == 'control' && !cancelled()
        run: |
          mv test-results/hosted-play/worker.log test-results/hosted-play/worker-protocol.log || true
          mv test-results/hosted-play/wrangler.log test-results/hosted-play/wrangler-protocol.log || true
      - name: Run private-banks and decks on a second boot
        if: matrix.shard == 'protocol' && matrix.arm == 'control' && !cancelled()
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow private-banks --flow decks --browser "$CHROMIUM" $BUDGET
      - name: Run the protocol verifier, private-banks and decks on one boot
        if: matrix.shard == 'protocol' && matrix.arm != 'control'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --with-protocol --flow private-banks --flow decks --browser "$CHROMIUM" $BUDGET $LEVERS
      - name: Summarise timing
        if: always()
        run: |
          xargs kill < "$RUNNER_TEMP/samplers.pid" 2>/dev/null || true
          {
            echo "### ${{ matrix.arm }} ${{ matrix.shard }} ${{ matrix.repeat }}: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
            echo '```'
            cat test-results/hosted-play/diagnostic-timing.jsonl 2>/dev/null || echo "no timing recorded"
            for report in test-results/hosted-play/browser/*/report.json; do
              if [ -f "$report" ]; then
                jq -c '{flow, diagnostic, failure}' "$report"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain hosted flow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: levers-${{ matrix.arm }}-${{ matrix.shard }}-${{ matrix.repeat }}
          path: test-results/hosted-play/**
          if-no-files-found: warn
          retention-days: 7
