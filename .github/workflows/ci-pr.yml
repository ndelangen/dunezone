name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    # Codecov uploads need CODECOV_TOKEN inside the reusable workflow — pass
    # only that secret (least privilege; the reusable workflow runs PR code).
    # Fork PRs get no secrets; codecov-action falls back to tokenless for
    # public repos and the upload steps never fail the build.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Single required-status-check context for branch protection: the workflow
  # file owns the definition of "green", so protection settings never chase
  # job renames. if: always() + explicit result check because a skipped
  # required check would otherwise count as passing.
  ci_ok:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require full verify success
        run: test "${{ needs.verify.result }}" = "success"
