name: PR CI

on:
  pull_request:
    # ready_for_review starts the full run on a pull request that was a draft (#1921).
    types: [opened, synchronize, reopened, ready_for_review]
  # Kept for a merge queue, which this repository cannot have today (GitHub offers none to a personal
  # account's repository); a change outside the hosted closure meets the shards in
  # hosted-play-daily.yml instead (#1598).
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Draft and full runs cancel only their own profile.
  # A late draft event must not displace full verification, even while it is pending (#2429).
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft == true && 'draft' || 'full' }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    # Granted for reusable-verify.yml, whose prior-pass steps read earlier runs' records; a called job gets no permission its caller withholds.
    permissions:
      contents: read
      actions: read
    # A draft runs only lint, test and game_release: agents iterate on drafts, and each push to a full
    # run costs about 80 of the account's runner minutes (#1921).
    with:
      draft: ${{ github.event.pull_request.draft == true }}
    # Fork PRs and merge-group code get no secrets; Codecov falls back to tokenless uploads.
    secrets:
      CODECOV_TOKEN: ${{ github.event_name == 'pull_request' && secrets.CODECOV_TOKEN || '' }}

  # Single required check owning the definition of "green"; if: always() so a skipped verify can't pass (#290).
  ci_ok:
    # A draft's run reports as ci_draft, so it never satisfies the required ci_ok check: marking the pull
    # request ready starts the full run, and a merge waits for that run's ci_ok.
    # A superseded draft run skips ci_draft rather than leaving a red draft check on the head.
    name: ${{ github.event.pull_request.draft == true && 'ci_draft' || 'ci_ok' }}
    if: ${{ always() && !(cancelled() && github.event.pull_request.draft == true) }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require full verify success
        run: test "${{ needs.verify.result }}" = "success"
