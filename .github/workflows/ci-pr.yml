name: PR CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    # Fork PRs and merge-group code get no secrets; Codecov falls back to tokenless uploads.
    secrets:
      CODECOV_TOKEN: ${{ github.event_name == 'pull_request' && secrets.CODECOV_TOKEN || '' }}

  # Single required check owning the definition of "green"; if: always() so a skipped verify can't pass (#290).
  ci_ok:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full verify success
        run: test "${{ needs.verify.result }}" = "success"
