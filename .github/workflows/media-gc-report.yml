name: Media collection report

# A dry run of the R2 media retention rules (#1888 step 9). It lists what a collection could remove
# and deletes nothing. It reads main's lock, every open pull request's lock and the release ledger,
# and fails rather than report from an incomplete listing.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: media-gc-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Report collection candidates
        shell: bash
        run: bun run media:gc | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
