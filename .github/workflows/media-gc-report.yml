name: Media report

# A dry run of the R2 media retention rules (#1888 step 9). It lists what a collection could remove
# and deletes nothing. It reads main's lock, every open pull request's lock and the release ledger,
# and fails rather than report from an incomplete listing.
# It is also the monthly sanity check of stored media: it fails when a variant any release record
# lists is missing from R2 or stored at another size. Deploys rely on that never happening, because
# they only ask R2 about variants no earlier deploy proved. It reads the bucket listing through the
# Cloudflare API, so no edge cache can hide a missing object.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: media-gc-report
  cancel-in-progress: true

env:
  # actions/checkout runs `git init`, whose "default branch name" hint filled ten lines of every job's log.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Report collection candidates and missing release variants
        shell: bash
        run: bun run media:gc | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
