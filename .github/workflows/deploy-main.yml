name: Deploy production

on:
  push:
    branches:
      - main
  # GitHub has recorded merges to main without emitting their push event, so no run started and
  # production stayed on the previous release (four merges on 2026-09-28 and 2026-09-29).
  # Dispatching this workflow on main deploys main's tip; docs/deployment.md has the recovery steps.
  # The production environment admits only main, so a dispatch from another branch fails before any
  # deploy step runs.
  # A dashboard edit to dunezone-game (a secret, a variable) marks it last deployed from the
  # dashboard, and from then on `wrangler deploy --strict` refuses any config that differs from it.
  # A dispatch with replace_dashboard_game_config deploys the game Worker without --strict once, so
  # main's config replaces the dashboard version. docs/deployment.md has the steps.
  workflow_dispatch:
    inputs:
      replace_dashboard_game_config:
        description: Replace a dashboard-edited game Worker config with main's (drops --strict once)
        type: boolean
        default: false

permissions:
  contents: read

# Every Wrangler call printed its version banner with an "update available" note and the telemetry notice.
# The pinned version in bun.lock is the one that deploys, and CI sends no usage telemetry.
env:
  WRANGLER_HIDE_BANNER: "true"
  WRANGLER_SEND_METRICS: "false"
  # actions/checkout runs `git init`, whose "default branch name" hint filled ten lines of every job's log.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

# No verify job (#286): main's ruleset only accepts a pull request merge whose required checks passed
# on a branch up to date with main, and a dispatched run deploys a commit that reached main that way.
# A merge through the ruleset's admin bypass skips those checks and deploys unverified.
jobs:
  # Ends the run green without deploying when production already serves a later commit, or, on the
  # run's first attempt, this commit after an earlier run of this workflow finished it green.
  # The deploy-production group queues releases and weekly snapshots without dropping a pending refresh.
  # So a late push event (80 to 219 s late on 2026-09-28 and 2026-09-29), a second event for a merge
  # that already deployed, or "Re-run all jobs" on an older run can start after a later release is
  # live, and without this check it would put the older commit back.
  # The group holds this job too, so it reads production only after the previous run has finished.
  # A second event for a merge whose first run failed after both Workers went out finds no green run
  # for its commit and deploys, which finishes that release (runs 36923609357 and 36923879225 on
  # 2026-10-01).
  # A run still queued or in progress, such as a rerun waiting behind this one, has no conclusion yet
  # and does not count: this run deploys, and the waiting run deploys again when it starts, or stops
  # at its own gate if it is a first attempt and this run finished green.
  # "Re-run all jobs" runs this job again with GITHUB_RUN_ATTEMPT above 1, and then only a later
  # commit stops it: a rerun deploys a commit production already has, which finishes a deploy that
  # failed after both Workers went out.
  # "Re-run failed jobs" keeps this job's first answer and deploys that run's commit whatever
  # production serves by then.
  release_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Job permissions replace the workflow's, so contents: read is restated, and actions: read lets
    # the gate list this workflow's runs for its commit.
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      base: ${{ steps.decision.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The decision asks GitHub's compare API where production's commits sit against this one, so the
      # job needs no history: deepening this shallow checkout with a commits-only filter crashed git
      # itself (#2721), and before that fetch-depth: 0 ran out the job's five minutes (#2610).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Decide whether production still needs this commit
        id: decision
        run: bun run ./scripts/deploy-decision.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: release_gate
    # Only the gate's explicit 'false' skips the deploy, and a missing or empty output deploys, the
    # same way an endpoint the gate cannot read does.
    # A failed gate job still skips it through the implicit success(), and the run fails.
    # dev_rebuild needs this job, so it follows the same answer.
    if: needs.release_gate.outputs.deploy != 'false'
    environment: production
    runs-on: ubuntu-24.04
    # The contract test budgets migrations, both active-version gates, narrowing and release work.
    # It also reserves ten minutes for checkout, dependency setup and step overhead.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Verify schema narrowing prerequisites
        run: bun run migrations:narrow-check
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Deploy Convex
        run: bun run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Run and verify required migrations
        run: bun run migrations:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Initialize Publication settings when absent
        run: bun run ./scripts/publication-revisions.ts initialize
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Preflight exact scheduled Worker release
        run: bun run ./scripts/publisher-deployment-contract.ts preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Check generated Worker types
        run: bun run publisher:types:check

      - name: Preflight private game Worker release
        run: bun run ./scripts/game-deployment-contract.ts preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check generated game Worker types
        run: bun run game:types:check

      - name: Typecheck game Worker release
        run: bun run game:typecheck

      - name: Typecheck Worker release
        run: bun run publisher:typecheck

      - uses: ./.github/actions/generated-images
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Generate OBJ pieces
        run: bun run generate:objs
      - name: Log generated output digest
        run: find public/m public/image public/web -type f | sort | xargs shasum -a 256 | shasum -a 256
      - name: Build unified Worker release
        run: bun run publisher:assets
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      # The build keeps raster copies for local runs, whose buckets start empty. Production serves them
      # from R2, so remove them before the final Static Assets file count is checked.
      - name: Omit raster copies from the release
        run: bun run publisher:omit-static-rasters

      - name: Verify assembled Worker assets
        run: bun run publisher:assets:check

      - name: Verify release build kept merged source exact
        run: >-
          git diff --exit-code &&
          git diff --cached --exit-code &&
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Dry-run exact Worker release
        run: bun run publisher:release:dry-run

      - name: Dry-run private game Worker release
        run: bun run game:dry-run

      - name: Deploy exact game Worker release
        run: |
          strict=(--strict)
          if [ "$REPLACE_DASHBOARD_CONFIG" = true ]; then
            echo "::warning::Replacing the dashboard-edited dunezone-game config with main's"
            strict=()
          fi
          bunx wrangler deploy "${strict[@]}" \
            --config workers/game/wrangler.jsonc \
            --tag "$GITHUB_SHA" \
            --message "GitHub Actions game $GITHUB_SHA" \
            --var "GIT_SHA:$GITHUB_SHA"
        env:
          REPLACE_DASHBOARD_CONFIG: ${{ inputs.replace_dashboard_game_config }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Require active game Worker before binding publisher
        id: game_active
        run: bun run ./scripts/game-deployment-contract.ts active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set canonical game callback origin
        run: bun node_modules/convex/bin/main.js env set PLAY_SERVICE_URL https://dune.zone --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      # The variant publish token lives for one release (#1888 step 4): each deploy installs a fresh random value
      # with the Worker it ships, and only this job ever holds it, so it is never stored or handed to a person.
      - name: Mint the variant publish token
        run: |
          set -euo pipefail
          umask 077
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '{"MEDIA_PUBLISH_TOKEN":"%s"}' "$token" > "$RUNNER_TEMP/publisher-secrets.json"
          printf '%s' "$token" > "$RUNNER_TEMP/media-publish-token"

      # The release carries no raster copies, so every variant it names must be in R2 before it goes live
      # (#1888 step 7b). The live Worker takes this release's token first, then the variants and the
      # release's prepared record go up through it, and only then does the new Worker deploy, keeping the
      # same token through --secrets-file. A failure here stops the deploy with the previous release live.
      - name: Install the variant publish token on the live Worker
        run: bun run publisher:secret:publish-token < "$RUNNER_TEMP/media-publish-token"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish raster variants
        timeout-minutes: 20
        env:
          MEDIA_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          MEDIA_PUBLISH_TOKEN="$(cat "$RUNNER_TEMP/media-publish-token")"
          export MEDIA_PUBLISH_TOKEN
          bun run media:publish --await-token
          bun run media:publish --rotated-token

      - name: Deploy exact Worker release
        run: >-
          bunx wrangler deploy
          --strict
          --config workers/publisher/wrangler.jsonc
          --tag "$GITHUB_SHA"
          --message "GitHub Actions production $GITHUB_SHA"
          --var "GIT_SHA:$GITHUB_SHA"
          --secrets-file "$RUNNER_TEMP/publisher-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke scheduled Worker release
        run: bun run ./scripts/publisher-deployment-contract.ts smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke game Worker through the canonical publisher binding
        run: bun run ./scripts/game-deployment-contract.ts smoke
        env:
          GAME_WORKER_VERSION_ID: ${{ steps.game_active.outputs.version_id }}

      - name: Activate higher checked-in Renderer revisions
        run: bun run ./scripts/publication-revisions.ts activate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Set canonical Convex authentication URLs
        run: bun run convex env set --from-file convex/auth.production.env --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      # Earlier deploys record every variant entry they proved. Only main's deploys write this cache, and
      # a miss proves nothing, so the verify below then downloads every entry.
      - name: Restore the variant entries earlier deploys proved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/media-verified
          key: media-verified-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: media-verified-

      # Proves that /m and the legacy URLs, both now answered from R2, serve the bytes this job encoded,
      # then marks the release deployed in the media ledger. Publishing already checked every variant's
      # stored integrity before the release went live, so this downloads only the entries no earlier
      # deploy proved, plus a random sample of 128 that catches a release serving every URL wrongly.
      - name: Verify raster variants and mark the release deployed
        timeout-minutes: 20
        env:
          MEDIA_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/media-publish-token" "$RUNNER_TEMP/publisher-secrets.json"' EXIT
          MEDIA_PUBLISH_TOKEN="$(cat "$RUNNER_TEMP/media-publish-token")"
          export MEDIA_PUBLISH_TOKEN
          bun run media:publish --verify
          bun run media:publish --deployed
          # Local setup reads these packs instead of one request per variant; they never decide what production serves.
          bun run media:packs

      - name: Keep the variant entries this deploy proved
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/media-verified
          key: media-verified-${{ github.run_id }}-${{ github.run_attempt }}

  # Storybook builds and verifies beside the production release instead of adding its two minutes after it, and
  # follows the gate's answer like the deploy job does.
  # Only its deploy waits for production: the Storybook Worker proxies /m, /image, /web and /published to dune.zone,
  # so it goes live after the deploy job has published this release's raster variants and Worker.
  storybook_build:
    needs: release_gate
    if: needs.release_gate.outputs.deploy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Storybook serves ../public, which carries the generated image variants.
      - uses: ./.github/actions/generated-images

      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Verify isolated Storybook publication
        run: bun run verify:storybook-publication

      - name: Keep the verified Storybook for its deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          # The raster copies are about 260 MB that .assetsignore keeps out of the Worker upload anyway.
          path: |
            storybook-static
            !storybook-static/m/**
            !storybook-static/image/**
            !storybook-static/web/**
          if-no-files-found: error
          include-hidden-files: true
          # A rerun of this job replaces the previous attempt's copy, and a later "Re-run failed jobs" can still find it.
          overwrite: true
          retention-days: 7

  # A failure here still fails the run, so the gate deploys the commit again on the next event, and "Re-run failed
  # jobs" after a Storybook-only failure reruns just this job.
  storybook_deploy:
    needs: [release_gate, storybook_build, deploy]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: storybook-static
        env:
          # v8.0.2 (the latest) prints Node's Buffer() deprecation on every download (actions/download-artifact#484).
          NODE_OPTIONS: --disable-warning=DEP0005

      - name: Deploy isolated Storybook
        run: >-
          bunx wrangler deploy
          --strict
          --config workers/storybook/wrangler.jsonc
          --tag "$GITHUB_SHA"
          --message "GitHub Actions Storybook $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke isolated Storybook
        run: bun run ./scripts/storybook-deployment-smoke.ts

  # Production has already shipped when this starts.
  # Dev preserves its data between the weekly snapshot refreshes.
  dev_rebuild:
    needs: [release_gate, deploy]
    uses: ./.github/workflows/dev-rebuild.yml
    secrets:
      CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
