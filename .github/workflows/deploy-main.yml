name: Deploy production

on:
  push:
    branches:
      - main
  # GitHub has recorded merges to main without emitting their push event, so no run started and
  # production stayed on the previous release (four merges on 2026-09-28 and 2026-09-29).
  # Dispatching this workflow on main deploys main's tip; docs/deployment.md has the recovery steps.
  # The production environment admits only main, so a dispatch from another branch fails before any
  # deploy step runs.
  # A dashboard edit to dunezone-game (a secret, a variable) marks it last deployed from the
  # dashboard, and from then on `wrangler deploy --strict` refuses any config that differs from it.
  # A dispatch with replace_dashboard_game_config deploys the game Worker without --strict once, so
  # main's config replaces the dashboard version. docs/deployment.md has the steps.
  workflow_dispatch:
    inputs:
      replace_dashboard_game_config:
        description: Replace a dashboard-edited game Worker config with main's (drops --strict once)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# No verify job (#286): main's ruleset only accepts a pull request merge whose required checks passed
# on a branch up to date with main, and a dispatched run deploys a commit that reached main that way.
# A merge through the ruleset's admin bypass skips those checks and deploys unverified.
jobs:
  # Ends the run green without deploying when production already serves a later commit, or, on the
  # run's first attempt, this commit after an earlier run of this workflow finished it green.
  # The deploy-production group runs one run at a time and holds one more waiting: a newly queued run
  # cancels the waiting one and takes its place, whatever commit either carries.
  # So a late push event (80 to 219 s late on 2026-09-28 and 2026-09-29), a second event for a merge
  # that already deployed, or "Re-run all jobs" on an older run can start after a later release is
  # live, and without this check it would put the older commit back.
  # The group holds this job too, so it reads production only after the previous run has finished.
  # A second event for a merge whose first run failed after both Workers went out finds no green run
  # for its commit and deploys, which finishes that release (runs 36923609357 and 36923879225 on
  # 2026-10-01).
  # A run still queued or in progress, such as a rerun waiting behind this one, has no conclusion yet
  # and does not count: this run deploys, and the waiting run deploys again when it starts, or stops
  # at its own gate if it is a first attempt and this run finished green.
  # "Re-run all jobs" runs this job again with GITHUB_RUN_ATTEMPT above 1, and then only a later
  # commit stops it: a rerun deploys a commit production already has, which finishes a deploy that
  # failed after both Workers went out.
  # "Re-run failed jobs" keeps this job's first answer and deploys that run's commit whatever
  # production serves by then.
  release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job permissions replace the workflow's, so contents: read is restated, and actions: read lets
    # the gate list this workflow's runs for its commit.
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      base: ${{ steps.decision.outputs.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The decision compares production's commits with this one in git history.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Decide whether production still needs this commit
        id: decision
        run: bun run ./scripts/deploy-decision.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: release_gate
    # Only the gate's explicit 'false' skips the deploy, and a missing or empty output deploys, the
    # same way an endpoint the gate cannot read does.
    # A failed gate job still skips it through the implicit success(), and the run fails.
    # dev_rebuild needs this job, so it follows the same answer.
    if: needs.release_gate.outputs.deploy != 'false'
    environment: production
    runs-on: ubuntu-latest
    # The contract test budgets migrations, both active-version gates, narrowing and release work.
    # It also reserves ten minutes for checkout, dependency setup and step overhead.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Verify schema narrowing prerequisites
        run: bun run migrations:narrow-check
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Deploy Convex
        run: bun run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Run and verify required migrations
        run: bun run migrations:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Initialize Publication settings when absent
        run: bun run ./scripts/publication-revisions.ts initialize
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Preflight exact scheduled Worker release
        run: bun run ./scripts/publisher-deployment-contract.ts preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Check generated Worker types
        run: bun run publisher:types:check

      - name: Preflight private game Worker release
        run: bun run ./scripts/game-deployment-contract.ts preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check generated game Worker types
        run: bun run game:types:check

      - name: Typecheck game Worker release
        run: bun run game:typecheck

      - name: Typecheck Worker release
        run: bun run publisher:typecheck

      - uses: ./.github/actions/generated-images
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Generate OBJ pieces
        run: bun run generate:objs
      - name: Log generated output digest
        run: find public/image public/web -type f | sort | xargs shasum -a 256 | shasum -a 256
      - name: Build unified Worker release
        run: bun run publisher:assets
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Retain browser bundles from the previous application release
        run: bun run publisher:retain-assets

      - name: Verify assembled Worker assets
        run: bun run publisher:assets:check

      - name: Verify release build kept merged source exact
        run: >-
          git diff --exit-code &&
          git diff --cached --exit-code &&
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Dry-run exact Worker release
        run: bun run publisher:release:dry-run

      - name: Verify public application runtime
        run: bun run publisher:application-runtime:verify

      - name: Dry-run private game Worker release
        run: bun run game:dry-run

      - name: Deploy exact game Worker release
        run: |
          strict=(--strict)
          if [ "$REPLACE_DASHBOARD_CONFIG" = true ]; then
            echo "::warning::Replacing the dashboard-edited dunezone-game config with main's"
            strict=()
          fi
          bunx wrangler deploy "${strict[@]}" \
            --config workers/game/wrangler.jsonc \
            --tag "$GITHUB_SHA" \
            --message "GitHub Actions game $GITHUB_SHA" \
            --var "GIT_SHA:$GITHUB_SHA"
        env:
          REPLACE_DASHBOARD_CONFIG: ${{ inputs.replace_dashboard_game_config }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Require active game Worker before binding publisher
        id: game_active
        run: bun run ./scripts/game-deployment-contract.ts active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set canonical game callback origin
        run: bun node_modules/convex/bin/main.js env set PLAY_SERVICE_URL https://dune.zone --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Deploy exact Worker release
        run: >-
          bunx wrangler deploy
          --strict
          --config workers/publisher/wrangler.jsonc
          --tag "$GITHUB_SHA"
          --message "GitHub Actions production $GITHUB_SHA"
          --var "GIT_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke scheduled Worker release
        run: bun run ./scripts/publisher-deployment-contract.ts smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke game Worker through the canonical publisher binding
        run: bun run ./scripts/game-deployment-contract.ts smoke
        env:
          GAME_WORKER_VERSION_ID: ${{ steps.game_active.outputs.version_id }}

      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Verify isolated Storybook publication
        run: bun run verify:storybook-publication

      - name: Deploy isolated Storybook
        run: >-
          bunx wrangler deploy
          --strict
          --config workers/storybook/wrangler.jsonc
          --tag "$GITHUB_SHA"
          --message "GitHub Actions Storybook $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke isolated Storybook
        run: bun run ./scripts/storybook-deployment-smoke.ts

      - name: Activate higher checked-in Renderer revisions
        run: bun run ./scripts/publication-revisions.ts activate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

      - name: Set canonical Convex site URL
        run: bunx convex env set SITE_URL https://dune.zone --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

  # Production has already shipped when this starts: a failed dev rebuild reddens the run without
  # ever gating the release.
  # The rebuild measures its change range from the release production served before this run, which
  # also covers a merge whose push event never arrived.
  # When the gate cannot name that release, the range starts at the push's previous tip; a dispatched
  # run has no previous tip, and an empty base rebuilds dev's data.
  dev_rebuild:
    needs: [release_gate, deploy]
    uses: ./.github/workflows/dev-rebuild.yml
    with:
      base: ${{ needs.release_gate.outputs.base || github.event.before }}
    secrets:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
