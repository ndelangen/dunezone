name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-verify.yml

  # Builds the Worker release concurrently with verify; deploy consumes the
  # artifact instead of rebuilding. Carries environment: production only to
  # read the env-scoped VITE_CONVEX_URL — the environment has no human gates.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated Worker types
        run: bun run publisher:types:check

      - name: Typecheck Worker release
        run: bun run publisher:typecheck

      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Log generated output digest (informational, not part of identity)
        run: find public/image public/web -type f | sort | xargs shasum -a 256 | shasum -a 256
      - name: Build unified Worker release
        run: bun run publisher:assets
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Verify assembled Worker assets
        run: bun run publisher:assets:check

      - name: Verify release build kept merged source exact
        run: >-
          git diff --exit-code &&
          git diff --cached --exit-code &&
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload Worker release assets
        uses: actions/upload-artifact@v4
        with:
          name: publisher-dist-${{ github.sha }}
          path: workers/publisher/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify schema narrowing prerequisites
        run: bun run migrations:narrow-check
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}

      - name: Deploy Convex
        run: bun run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}

      - name: Run and verify required migrations
        run: bun run migrations:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}

      - name: Initialize Publication settings when absent
        run: bun run ./scripts/publication-revisions.ts initialize
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}

      - name: Preflight exact scheduled Worker release
        run: bun run ./scripts/publisher-deployment-contract.ts preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Download built Worker release
        uses: actions/download-artifact@v4
        with:
          name: publisher-dist-${{ github.sha }}
          path: workers/publisher/dist

      - name: Verify assembled Worker assets
        run: bun run publisher:assets:check

      - name: Dry-run exact Worker release
        run: bun run publisher:release:dry-run

      - name: Deploy exact Worker release
        run: >-
          bunx wrangler deploy
          --strict
          --config workers/publisher/wrangler.jsonc
          --tag "$GITHUB_SHA"
          --message "GitHub Actions production $GITHUB_SHA"
          --var "GIT_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke scheduled Worker release
        run: bun run ./scripts/publisher-deployment-contract.ts smoke

      - name: Activate higher checked-in Renderer revisions
        run: bun run ./scripts/publication-revisions.ts activate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}

      - name: Set canonical Convex site URL
        run: bunx convex env set SITE_URL https://dune.zone --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
