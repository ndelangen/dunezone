name: Reusable Verify

on:
  workflow_call:
    inputs:
      hosted_only:
        description: Run the play_closure gate and the hosted play jobs alone, as the daily run on main does (#1598); every other job is skipped.
        type: boolean
        default: false
        required: false
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token; omitted on fork PRs (tokenless fallback)
        required: false

permissions:
  contents: read

jobs:
  # First in the file because it was the run's longest job (#1322). GitHub's docs on jobs and
  # limits give no order for a run's queued jobs. In past PR runs a job with a later ID waited for a
  # runner more often, and a job's ID loosely followed its place in this file. Being first should make
  # it wait less often when runners are short; it does not make it start first.
  storybook:
    name: storybook (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    strategy:
      fail-fast: false
      # Four shards balanced by measured file time, because the story suite ran 564 to 779 s on one
      # runner and the seven slowest Play page files were 58% of it (#1588). .storybook/shards.json owns the
      # rules and scripts/storybook-shard.ts resolves a shard's files; its test refuses a story file
      # no shard owns. Each shard uploads its own coverage and results under the storybook flag,
      # which Codecov merges.
      matrix:
        shard: [play-table, play-flows, components, pages]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Run the ${{ matrix.shard }} story shard with coverage
        run: bun run storybook:test:shard ${{ matrix.shard }} --coverage.enabled=true --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-storybook.junit.xml
      - name: Retain Storybook failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-failure-evidence-${{ matrix.shard }}
          path: |
            test-results/storybook-attachments/
            test-results/storybook-screenshots/
            test-results/vitest-storybook.junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload storybook coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/storybook/lcov.info
          flags: storybook
          disable_search: true
          fail_ci_if_error: false
      - name: Upload storybook test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-storybook.junit.xml
          flags: storybook
          disable_search: true
          fail_ci_if_error: false

  # Named for what it audits, because `audit` already means the Cloudflare live-drift
  # check in cloudflare-live-drift.yml and two checks with one name are unreadable.
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Reads bun.lock and package.json only, so no `bun install` and no cache; the script
      # imports nothing from a package for the same reason.
      # Fails the job on any advisory at moderate or above; a conscious exception is
      # `--ignore=<GHSA-id>` with the reason in the diff, never lowering the level.
      # Fail-closed: an unreachable registry still refuses, after four attempts of thirty
      # seconds with backoff between them, and the last log line names whether the run ended
      # on advisories or on the registry (#1053).
      - name: Audit dependencies for known advisories
        run: bun run dependencies:audit

  # The static gates share one job: each of the workflow lint, the Convex skip guard and the static
  # narrow check ran 12 to 14 s on a runner of its own after 5 to 12 s of setup (#1588), and a slot
  # held for that is a slot a long job waits for when runners are short.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The static narrow check below diffs against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint with inline PR annotations
        run: bun run lint:ci
      - name: Check formatting
        run: bun run format:check
      - name: Check for orphaned CSS module classes
        run: bun run check:css-orphans
      - name: Check every CSS custom property read resolves
        run: bun run check:css-vars
      - name: Check width media queries sit in the window chrome, on the ladder
        run: bun run check:breakpoints
      - name: Check every e2e spec is assigned to one shard
        run: bun run check:e2e-shards
      - name: Check the src/app top-level layout
        run: bun run check:app-layout
      - name: Check developer-facing prose
        run: bun run check:prose
      # The gates below ran as jobs of their own and reported whatever the lint steps found, so they keep running after an earlier step fails.
      - name: Enforce Convex skip guard
        if: ${{ !cancelled() }}
        run: bun run check:convex-skip
      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "${PWD}:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Check the scripts that local actions run
        # actionlint runs shellcheck on the run: scripts of workflows, not on those of the actions in
        # .github/actions, so an action keeps its script in a .sh file beside action.yml for this step.
        # The same image as above, which ships the shellcheck that actionlint runs.
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "${PWD}:/repo" --workdir /repo --entrypoint shellcheck
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/actions/*/*.sh
      - name: Detect schema narrowing for slug fields
        id: narrow_check
        # Reusable Verify only runs from PR CI, so base_ref is always set.
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          DIFF="$(git diff --unified=0 "origin/${BASE_REF}...HEAD" -- convex/schema.ts || true)"
          if echo "$DIFF" | grep -Eq "^-\\s*slug:\\s*v\\.optional\\(v\\.string\\(\\)\\)" && \
             echo "$DIFF" | grep -Eq "^\\+\\s*slug:\\s*v\\.string\\(\\)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce static narrow guard contract
        if: ${{ !cancelled() && steps.narrow_check.outputs.changed == 'true' }}
        run: bun run migrations:static-check

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - name: Detect unused files, exports, and dependencies
        run: bun run knip

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck authoring tool
        run: bun run tool:typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          with-deps: "false"
      - name: Authoring tool tests
        run: bun run tool:test
      - name: Unit tests
        run: bun run test --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-unit.junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          disable_search: true
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Failure results are the point of Test Analytics, so upload unless cancelled.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-unit.junit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: false

  generate_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    env:
      # Job-level so the bundle-upload step's `if` can test it. The secrets
      # context is not available in step-level `if` conditions.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate app artifacts
        run: bun run generate
      - uses: ./.github/actions/generated-images
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Generate OBJ pieces
        run: bun run generate:objs
      - name: Build app
        run: bun run app:build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - name: Upload bundle stats to Codecov (per category)
        # Bundler-agnostic analyzer (@codecov/vite-plugin peers with Vite <=6 only);
        # one bundle per asset category so media regeneration can't bury an app-code
        # regression. Skipped on fork PRs (no token); never fails the build.
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          # Categories upload independently; failures aggregate into one warning.
          status=0
          upload() {
            local name="$1"
            shift
            if ! bunx @codecov/bundle-analyzer "$@" --bundle-name="$name" --upload-token="$CODECOV_TOKEN"; then
              echo "::warning::bundle upload failed: $name"
              status=1
            fi
          }
          # Vite emits base64-style hashes (index-De4XUz5O.js) which the
          # analyzer's hex-only fallback regex never matches, so without a
          # pattern every build reports all assets as deleted+added. Only the
          # app bundle gets the pattern: the generated-media categories have
          # stable un-hashed names, and the pattern would collapse any
          # dash-containing name (foo-bar.png -> foo-*.png) into collisions.
          upload dunezone-app dist/client/public --normalize-assets-pattern='[name]-[hash].js'
          upload dunezone-images dist/client/image dist/client/web
          upload dunezone-vectors dist/client/vector
          upload dunezone-objs dist/client/obj
          upload dunezone-pages dist/client/page
          upload dunezone-fonts dist/client/font
          exit "$status"

  publisher_release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Log generated output digest
        run: find public/image public/web -type f | sort | xargs shasum -a 256 | shasum -a 256
      - name: Generate OBJ pieces
        run: bun run generate:objs
      - name: Test publisher and delivery
        # The src/shared sources join the denominator, extension-scoped as coverage-denominator.ts scopes them, because the root test job no longer runs these files (#1588) and they are the only tests that reach some of those lines.
        run: bun run publisher:test --coverage.enabled=true '--coverage.include=workers/**/*.ts' '--coverage.include=src/shared/**/*.ts' '--coverage.include=src/shared/**/*.tsx' --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-publisher.junit.xml
      - name: Upload publisher coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: publisher
          disable_search: true
          fail_ci_if_error: false
      - name: Upload publisher test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-publisher.junit.xml
          flags: publisher
          disable_search: true
          fail_ci_if_error: false
      - name: Typecheck publisher
        run: bun run publisher:typecheck
      - name: Build, verify manifest, and dry-run unified Worker release
        run: bun run publisher:release:verify
        env:
          VITE_CONVEX_URL: https://exuberant-finch-263.eu-west-1.convex.cloud
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Exercise narrow snapshot contract in Chromium
        run: bun run workers/publisher/capture-contract-regression.ts
      - name: Check Worker startup
        run: bun run publisher:startup

  game_release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check generated game Worker types
        run: bun run game:types:check
      - name: Typecheck game Worker
        run: bun run game:typecheck
      - name: Test game Worker
        # The root test job no longer runs these files (#1588), so the coverage they give workers/game, and the src/shared lines only they reach, is collected here.
        run: bun run game:test --coverage.enabled=true '--coverage.include=workers/game/**/*.ts' '--coverage.include=src/shared/**/*.ts' '--coverage.include=src/shared/**/*.tsx' --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-game.junit.xml
      - name: Upload game coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: game
          disable_search: true
          fail_ci_if_error: false
      - name: Upload game test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-game.junit.xml
          flags: game
          disable_search: true
          fail_ci_if_error: false
      - name: Dry-run private game Worker
        run: bun run game:dry-run
      - name: Check game Worker startup
        run: bun run game:startup
      - name: Retain game test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-test-evidence-${{ github.run_id }}
          path: test-results/vitest-game.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # Decides whether the four hosted jobs below run (#1598). On a pull request they run only when a
  # changed file lies in scripts/lib/hosted-play-closure.ts's closure, whose unit test holds it to the
  # import graph of the play pages, the Workers, the launcher and the builds it runs. On the daily run
  # from hosted-play-daily.yml they run unless main's tree already had them. Any other event, and a
  # diff this job cannot read or the compare API cuts short, run the shards. The job's own failure
  # fails the run, so ci_ok never passes on shards that were neither run nor deliberately skipped.
  play_closure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The script imports nothing from node_modules, so the job installs Bun alone and the shards wait for no dependency install.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Decide from the changed files
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
          FORCE: ${{ github.event.inputs.force }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # The shards run or are skipped, with the reason on the step summary.
          shards_run() {
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf '### Hosted play shards run\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          shards_skip() {
            echo "run=false" >> "$GITHUB_OUTPUT"
            printf '### Hosted play shards skipped\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # Reads one API path into a file; a reading that fails runs the shards with the reason and ends the step, so no API error fails this job.
          read_api() {
            if ! gh api "$1" > "$2"; then
              shards_run "The $3 could not be read from the API, so the shards run."
              exit 0
            fi
          }
          # The files of a compare response, one per line, into changed-files.txt.
          # A renamed file counts under both its names, so a file moved out of the closure still reaches.
          # One response carries the files of the whole comparison (paging splits only its commits) and lists at most 300, so a list that long may be cut short and fails this function.
          files_of() {
            jq -r '.files[] | .filename, (.previous_filename // empty)' "$1" > changed-files.txt \
              && [ "$(grep -c . changed-files.txt)" -lt 300 ]
          }
          case "$EVENT" in
            pull_request)
              # Three dots: the files changed since the merge base, so main's own commits do not count.
              if ! gh api "repos/$REPO/compare/$BASE...$HEAD" > compare.json || ! files_of compare.json; then
                shards_run "The changed files could not be read in full from the compare API, so the shards run."
                exit 0
              fi
              # The script writes run=true or run=false to the outputs itself; a script that fails writes nothing and fails this job.
              bun scripts/hosted-play-closure.ts < changed-files.txt
              ;;
            schedule | workflow_dispatch)
              if [ "$FORCE" = true ]; then
                shards_run "A dispatch asked for them whatever main's tree had."
                exit 0
              fi
              # The daily run on main: the shards run unless this tree already had them, from the last run of the calling workflow that checked this commit, or from the run of the pull request that merged as this commit when that merge was up to date (the API says ahead) and its diff reached the closure.
              # The calling workflow's file, from owner/repo/.github/workflows/<file>@<ref>.
              workflow="${WORKFLOW_REF#*/.github/workflows/}"
              workflow="${workflow%@*}"
              read_api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&status=success&per_page=1" runs.json "previous runs of $workflow"
              if [ "$(jq -r '.workflow_runs[0].head_sha // empty' runs.json)" = "$SHA" ]; then
                shards_skip "main has not moved since the last $workflow run checked $SHA."
                exit 0
              fi
              read_api "repos/$REPO/commits/$SHA" commit.json "commit at main's tip"
              read -r first second <<< "$(jq -r '[.parents[].sha] | join(" ")' commit.json)"
              if [ -z "${second:-}" ]; then
                shards_run "$SHA is not a merge commit, so no pull request run stands for its tree."
                exit 0
              fi
              read_api "repos/$REPO/compare/$first...$second" compare.json "merged pull request's comparison with main"
              status="$(jq -r .status compare.json)"
              if [ "$status" != ahead ]; then
                shards_run "The pull request that merged as $SHA was not up to date with main ($status), so its run checked another tree."
                exit 0
              fi
              if ! files_of compare.json; then
                shards_run "The merged pull request's files could not be read in full from the compare API, so the shards run."
                exit 0
              fi
              # The script's own output and summary are not wanted here; its decision is read from the JSON it prints.
              decision="$(GITHUB_OUTPUT='' GITHUB_STEP_SUMMARY='' bun scripts/hosted-play-closure.ts < changed-files.txt)"
              if [ "$(jq .run <<< "$decision")" = true ]; then
                shards_skip "The pull request that merged as $SHA was up to date and its diff reached the closure, so its run executed the shards on this tree."
              else
                shards_run "The pull request that merged as $SHA skipped the shards, so no run has executed them on this tree."
              fi
              ;;
            *)
              shards_run "Every other event runs them; this is a $EVENT run."
              ;;
          esac

  hosted_play:
    name: hosted_play (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: play_closure
    if: needs.play_closure.outputs.run == 'true'
    # Above the launcher's own budgets, so a slow flow ends with its name and its evidence, not a
    # cancelled job. The protocol shard's budgets add up to 27 minutes: 180 s for the protocol
    # verifier, then 480 s for each of private-banks, decks and results.
    # With a 46 s boot and about 35 s of setup that comes near 28.5 minutes.
    timeout-minutes: 32
    strategy:
      fail-fast: false
      # Each shard boots one stack and runs its flows on it, each on a fresh game (#1322). Each flow
      # names its shard in scripts/verify-hosted-flows.ts, and --shard selects them.
      # scripts/game-deployment-contract.test.ts fails when a shard named there has no entry here.
      matrix:
        include:
          - shard: regular
            protocol-verifier: false
          - shard: catalogue
            protocol-verifier: false
          # The protocol verifier runs first, then the shard's flows on the same boot.
          - shard: protocol
            protocol-verifier: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Select full Chromium in new headless mode
        # The flows' budgets were measured in full Chromium, not Playwright's headless shell (#1343).
        # On Linux the browser driver adds --use-angle=swiftshader itself (#1414).
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          "$chromium_path" --version
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Run the ${{ matrix.shard }} shard
        # The generated-images step above already wrote the image and vector output.
        # Full Chromium with the driver's --use-angle=swiftshader draws WebGL2 through SwiftShader on this
        # runner (#1322, #1458), so a runner image that renders otherwise fails each flow at its first table.
        env:
          SHARD: ${{ matrix.shard }}
          PROTOCOL_VERIFIER: ${{ matrix.protocol-verifier }}
        run: |
          browser_only=(--browser-only)
          if [ "$PROTOCOL_VERIFIER" = true ]; then
            browser_only=()
          fi
          bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --shard "$SHARD" "${browser_only[@]}" --browser "$CHROMIUM" --expect-renderer webgl2-swiftshader
      - name: Summarise each flow
        # always(), because a job that reaches timeout-minutes reads as cancelled.
        # The summary never changes the shard's result, so a lookup or report it cannot read fails only this step.
        if: always()
        continue-on-error: true
        uses: ./.github/actions/hosted-play-summary
        with:
          heading: hosted_play ${{ matrix.shard }}
          shard: ${{ matrix.shard }}
          protocol-verifier: ${{ matrix.protocol-verifier }}
      - name: Retain hosted game integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-play-evidence-${{ github.run_id }}-shard-${{ matrix.shard }}
          # The verification, Worker and Wrangler logs, each flow's log, and each flow's report, captures and frames.
          path: |
            test-results/hosted-play/*.log
            test-results/hosted-play/browser/
          if-no-files-found: warn
          retention-days: 14

  # The regular flow once more, on macOS, where full Chromium draws the Play table with WebGPU on the
  # runner's Metal device (#1322). The Linux shards draw WebGL2 on SwiftShader, so they pass a defect
  # that only WebGPU shows, such as #1272's vertex buffer validation error.
  hosted_play_webgpu:
    name: hosted_play_webgpu (regular)
    # A standard runner, which costs nothing on a public repository; a larger macOS runner is billed even
    # there. Pinned rather than macos-latest, because the WebGPU adapter comes with the image.
    runs-on: macos-26
    needs: play_closure
    if: needs.play_closure.outputs.run == 'true'
    # Above the regular flow's ten-minute budget, so a slow flow ends with its name and its evidence.
    # Setup took about 45 s and the build and boot about 70 s, which comes near twelve minutes.
    # A passing job took 249 to 276 s when this was measured (#1322).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - name: Install full Chromium
        # Not the playwright-chromium action: it caches Linux's ~/.cache/ms-playwright, and on macOS
        # Playwright installs to ~/Library/Caches/ms-playwright. The download takes about 10 s here.
        # The lockfile's own Playwright CLI, because npx would fetch a package that is not installed.
        run: node_modules/.bin/playwright install --no-shell chromium
      - name: Select full Chromium in new headless mode
        # On macOS the browser driver adds no switch, so Chromium chooses its own WebGPU adapter.
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          "$chromium_path" --version
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Run the regular flow expecting WebGPU
        # The generated-images step above already wrote the image and vector output.
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --shard regular --browser-only --browser "$CHROMIUM" --expect-renderer webgpu
      - name: Summarise each flow
        # As in hosted_play: always() for a timed-out job, and the summary never changes the job's result.
        if: always()
        continue-on-error: true
        uses: ./.github/actions/hosted-play-summary
        with:
          heading: hosted_play_webgpu regular
          shard: regular
      - name: Retain hosted game integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-play-evidence-${{ github.run_id }}-webgpu-regular
          path: |
            test-results/hosted-play/*.log
            test-results/hosted-play/browser/
          if-no-files-found: warn
          retention-days: 14

  tool_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Authoring tool E2E
        run: bun run tool:test:e2e

  # Builds the static Storybook and drives it in Chromium: 52 s that used to run ahead of the story
  # tests on the run's longest job. On its own runner the two proceed side by side. deploy-main.yml
  # runs the same script again before it deploys the artifact.
  storybook_publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Verify the public Storybook artifact
        run: bun run verify:storybook-publication

  # Proves two local launches never share ports, containers or data. It needs Docker and
  # nothing of the e2e suite, so it runs once here rather than before every shard.
  local_convex_isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.hosted_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pull Convex images
        run: docker compose -f docker-compose.convex-local.yml pull -q
      - name: Prove concurrent local Convex isolation
        run: bun run test:local-convex-isolation

  e2e_docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ !inputs.hosted_only }}
    strategy:
      fail-fast: false
      # Three shards, each a machine of its own with one Playwright worker: three files at once
      # on one machine cost every test 2.5x its uncontended time and put the longest at 87% of
      # its kill (#1050). Each shard is named for the journey that anchors it; the file lists
      # live in e2e/shards.json, balanced by measured cost, and check:e2e-shards in the lint
      # job refuses a spec that no shard lists or two do.
      matrix:
        shard: [editor, factions, rulebooks]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Pre-pull Convex images in background
        # Overlaps the pull with dependency/browser install; the wait step below
        # serializes before e2e-local.sh runs compose.
        run: |
          (docker compose -f docker-compose.convex-local.yml pull -q > /tmp/convex-pull.log 2>&1 || true; touch /tmp/convex-pull.done) &
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - uses: ./.github/actions/generated-images
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Create local E2E env file
        run: |
          cat > "$RUNNER_TEMP/.env.e2e.local" <<'EOF'
          CONVEX_BACKEND_PORT=3210
          CONVEX_SITE_PORT=3211
          CONVEX_DASHBOARD_PORT=6791
          CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210
          CONVEX_SELF_HOSTED_ADMIN_KEY=replace-me
          VITE_CONVEX_URL=http://127.0.0.1:3210
          E2E_APP_PORT=6001
          SITE_URL=http://localhost:6001
          CONVEX_SITE_URL=http://127.0.0.1:3211
          E2E_LOCAL_AUTH=true
          VITE_E2E_LOCAL_AUTH=true
          IS_TEST=true
          AUTH_E2E_PASSWORD=ci-test-password
          PLAYWRIGHT_BASE_URL=http://localhost:6001
          PLAYWRIGHT_HEADLESS=true
          PLAYWRIGHT_USER_A_EMAIL=e2e-user-a@example.com
          PLAYWRIGHT_USER_B_EMAIL=e2e-user-b@example.com
          PLAYWRIGHT_USER_PASSWORD=ci-test-password
          EOF
      - name: Wait for Convex image pre-pull
        # Non-fatal on timeout or pull failure: compose up pulls whatever is missing.
        run: timeout 120 bash -c 'until [ -f /tmp/convex-pull.done ]; do sleep 1; done' || true
      # The phases below are one flow (scripts/e2e-local.sh), split into steps
      # so the Actions UI shows per-phase timing. State crosses step boundaries
      # via files under .playwright/ (admin key, app URL, app server pid); the
      # static server backgrounded in "Start app server" (production build,
      # scripts/e2e-serve-dist.mjs) keeps running into the Playwright step,
      # same as the image pre-pull above.
      - name: Boot Convex backend
        run: bun run e2e:local up
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Provision Convex deployment
        run: bun run e2e:local provision
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Verify committed Convex bindings match the provision push
        # The provision push regenerates convex/_generated with the pinned CLI against the
        # docker backend, so a PR that changed convex/ without committing its bindings goes
        # red here instead of refusing the production deploy at preflight: nine deploys were
        # refused that way between 2026-08-25 and 2026-09-01 (#1047). Codegen needs a
        # deployment (#1046), which is why the check rides this job and not lint.
        run: |
          set -euo pipefail
          drift="$(git status --porcelain -- convex/_generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff -- convex/_generated
            # A new generated file is untracked, so the diff above cannot show it; print it against nothing.
            echo "$drift" | awk '$1 == "??" {print $2}' | while IFS= read -r untracked; do
              git --no-pager diff --no-index -- /dev/null "$untracked" || true
            done
            first="$(echo "$drift" | head -n 1 | awk '{print $2}')"
            echo "::error file=${first}::convex/_generated differs from what the provision push generated. Commit the regenerated bindings: extend api.d.ts in its own pattern, or regenerate against a local backend, never against shared dev."
            exit 1
          fi
          echo "convex/_generated matches the provision push."
      - name: Start app server
        run: bun run e2e:local serve
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Run Playwright E2E
        run: bun run e2e:local test
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
          PLAYWRIGHT_HEADLESS: "true"
          E2E_COVERAGE: "1"
          E2E_SHARD: ${{ matrix.shard }}
      - name: Tear down E2E stack
        # Replaces the script's `trap cleanup EXIT`, which cannot span steps.
        if: always()
        run: bun run e2e:local down
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Upload e2e test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/playwright.junit.xml
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
      - name: Upload e2e coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/e2e/lcov.info
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ github.run_id }}-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
          path: |
            ${{ github.workspace }}/playwright-report
            ${{ github.workspace }}/test-results
            ${{ github.workspace }}/.playwright/app.log
            ${{ github.workspace }}/.playwright/build.log
            ${{ github.workspace }}/.playwright/*.zip
