name: Reusable Verify

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token; omitted on fork PRs (tokenless fallback)
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint with inline PR annotations
        run: bun run lint:ci
      - name: Check formatting
        run: bun run format:check

  knip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Detect unused files, exports, and dependencies
        run: bun run knip

  convex_skip_guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Enforce Convex skip guard
        run: bun run check:convex-skip

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck authoring tool
        run: bun run tool:typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Authoring tool tests
        run: bun run tool:test
      - name: Unit tests
        run: bun run test --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-unit.junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          disable_search: true
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Failure results are the point of Test Analytics — upload unless cancelled.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-unit.junit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: false

  generate_and_build:
    runs-on: ubuntu-latest
    env:
      # Job-level so the bundle-upload step's `if` can test it — the secrets
      # context is not available in step-level `if` conditions.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate app artifacts
        run: bun run generate
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Generate OBJ pieces
        run: bun run generate:objs
      - name: Build app
        run: bun run app:build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - name: Upload bundle stats to Codecov (per category)
        # @codecov/vite-plugin only peers with Vite <=6 (no rolldown support),
        # so the bundler-agnostic analyzer runs on the finished client build
        # instead. One bundle per asset category: dist/client is ~96% generated
        # media, and a single blob would let an image regeneration bury an
        # app-code regression. dunezone-app (compiled JS/CSS) is the one that
        # tracks dependency/code bloat. Not tokenless — skipped on fork PRs
        # where the secret is absent; never fails the build.
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          # Each category uploads independently: one transient failure must
          # not suppress the remaining bundles. Aggregate status surfaces as a
          # warning; continue-on-error keeps the job green either way.
          status=0
          upload() {
            local name="$1"
            shift
            if ! bunx @codecov/bundle-analyzer "$@" --bundle-name="$name" --upload-token="$CODECOV_TOKEN"; then
              echo "::warning::bundle upload failed: $name"
              status=1
            fi
          }
          upload dunezone-app dist/client/public
          upload dunezone-images dist/client/image dist/client/web
          upload dunezone-vectors dist/client/vector
          upload dunezone-objs dist/client/obj
          upload dunezone-pages dist/client/page
          upload dunezone-fonts dist/client/font
          exit "$status"

  publisher_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Log generated output digest (informational, not part of identity)
        run: find public/image public/web -type f | sort | xargs shasum -a 256 | shasum -a 256
      - name: Generate OBJ pieces
        run: bun run generate:objs
      - name: Test publisher and delivery
        run: bun run publisher:test --coverage.enabled=true '--coverage.include=workers/**' --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-publisher.junit.xml
      - name: Upload publisher coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: publisher
          disable_search: true
          fail_ci_if_error: false
      - name: Upload publisher test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-publisher.junit.xml
          flags: publisher
          disable_search: true
          fail_ci_if_error: false
      - name: Typecheck publisher
        run: bun run publisher:typecheck
      - name: Build, verify manifest, and dry-run unified Worker release
        run: bun run publisher:release:verify
        env:
          VITE_CONVEX_URL: https://exuberant-finch-263.eu-west-1.convex.cloud
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for publisher contract regression
        run: npx playwright install --with-deps chromium
      - name: Exercise narrow snapshot contract in Chromium
        run: bun run workers/publisher/capture-contract-regression.ts
      - name: Check Worker startup
        run: bun run publisher:startup

  tool_e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authoring tool E2E
        run: bun run tool:test:e2e

  storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Build Storybook
        run: bun run build-storybook
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for story tests
        run: npx playwright install --with-deps chromium
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Run story tests with coverage
        run: bun run storybook:test --coverage.enabled=true --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-storybook.junit.xml
      - name: Upload storybook coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/storybook/lcov.info
          flags: storybook
          disable_search: true
          fail_ci_if_error: false
      - name: Upload storybook test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/vitest-storybook.junit.xml
          flags: storybook
          disable_search: true
          fail_ci_if_error: false

  migration_static_narrow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Detect schema narrowing for slug fields
        id: narrow_check
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="$BASE_REF...HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}...HEAD"
          else
            RANGE="HEAD~1...HEAD"
          fi

          DIFF="$(git diff --unified=0 "$RANGE" -- convex/schema.ts || true)"
          if echo "$DIFF" | grep -Eq "^-\\s*slug:\\s*v\\.optional\\(v\\.string\\(\\)\\)" && \
             echo "$DIFF" | grep -Eq "^\\+\\s*slug:\\s*v\\.string\\(\\)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce static narrow guard contract
        if: steps.narrow_check.outputs.changed == 'true'
        run: |
          bun -e '
          const manifest = await Bun.file("convex/migration-guards.json").json();
          const entries = Array.isArray(manifest.entries) ? manifest.entries : [];
          if (entries.length === 0) throw new Error("migration-guards.json has no entries");
          const ids = new Set(entries.map((e) => e.id));
          const narrowEntries = entries.filter((e) => e.phase === "narrow");
          if (narrowEntries.length === 0) throw new Error("At least one narrow entry is required when schema narrowing is detected");
          for (const entry of entries) {
            if (entry.phase !== "widen" && entry.phase !== "narrow") {
              throw new Error(`Invalid phase for ${entry.id}`);
            }
            for (const req of entry.requires ?? []) {
              if (!ids.has(req)) throw new Error(`Missing required migration id: ${req}`);
            }
          }
          '
          echo "Static narrow guard passed."

  e2e_docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pre-pull Convex images in background
        # Overlaps the image pull with dependency/browser install. The wait
        # step below synchronizes before e2e-local.sh runs compose, so two
        # compose processes never touch the same project concurrently.
        run: |
          (docker compose -f docker-compose.convex-local.yml pull -q > /tmp/convex-pull.log 2>&1 || true; touch /tmp/convex-pull.done) &
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        # No --with-deps: the ubuntu-24.04 runner image already ships every
        # shared library Chromium needs; Playwright validates at launch and
        # fails fast if that ever stops being true.
        run: npx playwright install chromium
      - name: Restore generated images
        id: image_cache
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/web
            src/game/data/assetMap.generated.ts
          key: generated-images-${{ hashFiles('media/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'bun.lock') }}
      - name: Generate image variants
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: bun run generate:images
      - name: Generate vector variants
        run: bun run generate:vectors
      - name: Verify generated images structurally
        run: bun run verify:images
      - name: Verify generated vectors structurally
        run: bun run verify:vectors
      - name: Create local E2E env file
        run: |
          cat > "$RUNNER_TEMP/.env.e2e.local" <<'EOF'
          CONVEX_BACKEND_PORT=3210
          CONVEX_SITE_PORT=3211
          CONVEX_DASHBOARD_PORT=6791
          CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210
          CONVEX_SELF_HOSTED_ADMIN_KEY=replace-me
          VITE_CONVEX_URL=http://127.0.0.1:3210
          E2E_APP_PORT=6001
          SITE_URL=http://localhost:6001
          CONVEX_SITE_URL=http://127.0.0.1:3211
          E2E_LOCAL_AUTH=true
          VITE_E2E_LOCAL_AUTH=true
          IS_TEST=true
          AUTH_E2E_PASSWORD=ci-test-password
          PLAYWRIGHT_BASE_URL=http://localhost:6001
          PLAYWRIGHT_HEADLESS=true
          PLAYWRIGHT_USER_A_EMAIL=e2e-user-a@example.com
          PLAYWRIGHT_USER_B_EMAIL=e2e-user-b@example.com
          PLAYWRIGHT_USER_PASSWORD=ci-test-password
          EOF
      - name: Wait for Convex image pre-pull
        # Non-fatal on timeout or pull failure: compose up pulls whatever is missing.
        run: timeout 120 bash -c 'until [ -f /tmp/convex-pull.done ]; do sleep 1; done' || true
      # The phases below are one flow (scripts/e2e-local.sh), split into steps
      # so the Actions UI shows per-phase timing. State crosses step boundaries
      # via files under .playwright/ (admin key, app URL, vite pid); the vite
      # dev server backgrounded in "Start app server" keeps running into the
      # Playwright step, same as the image pre-pull above.
      - name: Boot Convex backend
        run: bun run e2e:local up
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Provision Convex deployment
        run: bun run e2e:local provision
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Start app server
        run: bun run e2e:local serve
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Run Playwright E2E
        run: bun run e2e:local test
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
          PLAYWRIGHT_HEADLESS: "true"
          E2E_COVERAGE: "1"
      - name: Tear down E2E stack
        # Replaces the script's `trap cleanup EXIT`, which cannot span steps.
        if: always()
        run: bun run e2e:local down
        env:
          E2E_ENV_FILE: ${{ runner.temp }}/.env.e2e.local
      - name: Upload e2e test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results/playwright.junit.xml
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
      - name: Upload e2e coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/e2e/lcov.info
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ github.workspace }}/playwright-report
            ${{ github.workspace }}/test-results
            ${{ github.workspace }}/.playwright/vite.log
