name: Convex usage

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: convex-usage
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prepare report and previous successful baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p usage previous
          previous="$(gh api "repos/$REPO/actions/artifacts?name=convex-usage-report&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$previous" ]; then
            gh api "repos/$REPO/actions/artifacts/$previous/zip" > "${RUNNER_TEMP}/convex-usage-previous.zip"
            unzip -q "${RUNNER_TEMP}/convex-usage-previous.zip" -d previous
          fi
      - name: Read production counters and bounded function sample
        run: bun run scripts/convex-usage.ts --capture usage/production.json
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Read dev counters and bounded function sample
        run: bun run scripts/convex-usage.ts --capture usage/development.json
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
      - name: Assess growth and new threshold crossings
        id: report
        run: bun run scripts/convex-usage.ts --report usage --previous previous/report.json
        env:
          CONVEX_IO_REFERENCE_GB: ${{ vars.CONVEX_IO_REFERENCE_GB || '1' }}
          CONVEX_IO_DAILY_ALERT_GB: ${{ vars.CONVEX_IO_DAILY_ALERT_GB || '0.1' }}
      - name: Notify only on a new threshold crossing
        if: steps.report.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create convex-usage --repo "$REPO" --description "Convex usage crossed a reference threshold or collection failed" --color B60205 --force
          printf '\nRun: %s\n' "$RUN_URL" >> usage/report.md
          number="$(gh issue list --repo "$REPO" --label convex-usage --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file usage/report.md
          else
            gh issue create --repo "$REPO" --title "Convex usage needs attention" --label convex-usage --label needs-triage --body-file usage/report.md
          fi
      # Store alert state only after a notification succeeds, so a failed delivery is retried tomorrow.
      - name: Save report and next baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: convex-usage-report
          path: usage/
          retention-days: 90
          if-no-files-found: error
      - name: Report a collection or notification failure once
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create convex-usage --repo "$REPO" --description "Convex usage crossed a reference threshold or collection failed" --color B60205 --force
          number="$(gh issue list --repo "$REPO" --label convex-usage --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            printf 'Convex usage collection or notification failed. No new baseline was saved. Inspect the failing step and retry the run: %s\n' "$RUN_URL" > "${RUNNER_TEMP}/convex-usage-failure.md"
            gh issue create --repo "$REPO" --title "Convex usage collection failed" --label convex-usage --label needs-triage --body-file "${RUNNER_TEMP}/convex-usage-failure.md"
          fi
