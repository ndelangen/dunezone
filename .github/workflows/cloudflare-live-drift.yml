name: Cloudflare live drift

on:
  # Not pull_request_target: GitHub blocks that trigger in public repositories from 2 December 2026
  # (brownouts on 9 and 16 November). The job still checks out trusted main, never the PR head.
  # A fork pull request gets no secrets, so its audit fails; open such a change from a branch in this repository instead.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps a pull_request run apart from any other trigger for the same PR.
  group: cloudflare-live-drift-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # actions/checkout runs `git init`, whose "default branch name" hint filled ten lines of every job's log.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  audit:
    runs-on: ubuntu-24.04
    # Publisher inventory plus the private game audit each retain bounded per-request retries.
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 NOSONAR: checks out the base branch, never the pull request head
        with:
          # base_ref is the PR's target branch (main); a merge group audits the default branch; a manual run audits its ref.
          ref: ${{ github.base_ref || github.event_name == 'merge_group' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Reject live Cloudflare drift
        run: bun run cloudflare:drift-check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
