name: WebGPU probe

# Throwaway (#1322): runs the regular hosted_play shard on GitHub's standard macOS arm64 runner with full
# Chromium and --expect-renderer webgpu, to see whether that runner draws Play with WebGPU.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: webgpu-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hosted_play_macos:
    name: hosted_play macOS WebGPU (regular)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record runner specs
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPHardwareDataType SPDisplaysDataType
          node --version
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - name: Install full Chromium
        run: npx playwright install chromium
      - name: Select full Chromium in new headless mode
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          "$chromium_path" --version
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Read the WebGPU adapter
        continue-on-error: true
        run: bun --no-env-file scripts/webgpu-probe-adapter.mjs
      - name: Run the regular shard expecting WebGPU
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --shard regular --browser-only --browser "$CHROMIUM" --expect-renderer webgpu
      - name: Summarise each flow
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          out=test-results/hosted-play
          {
            echo "### hosted_play macOS regular"
            echo
            echo '| Flow | Result | Seconds | Renderer | Adapter | Chromium | Failing step | Error |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            for report in "$out"/browser/*/report.json; do
              [ -f "$report" ] || continue
              jq -r 'def seconds: sub("\\.[0-9]+Z$"; "Z") | fromdate;
                def cell: gsub("\\|"; "/");
                def step: [(.at // "" | [match("(scripts/)?verify-hosted-[^/:() ]+:[0-9]+").string][0]), "after \"\(.afterCheck)\""]
                  | map(select(. != null)) | join(", ");
                def message: .message // "" | [splits("\\s+")] | map(select(length > 0)) | join(" ")
                  | if length > 300 then .[:297] + "..." else . end;
                "| \(.flow) | \(if .failure then "fail" else "pass" end) | \((.finishedAt | seconds) - (.startedAt | seconds)) | \(.renderer.kind // "not read") | \(.renderer.adapter // .renderer.glRenderer // "" | tostring | cell) | \(.chromium.build // "") \(.chromium.version // "") | \(if .failure then .failure | step | cell else "" end) | \(if .failure then .failure | message | cell else "" end) |"' "$report"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webgpu-probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/hosted-play/*.log
            test-results/hosted-play/*.txt
            test-results/hosted-play/browser/
          if-no-files-found: warn
          retention-days: 7
