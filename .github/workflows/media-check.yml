name: Monthly media check

# Proves that production still serves every raster variant main's lock names, byte for byte, from
# /m and from its legacy URL. Deploys only ask R2 about variants no earlier deploy proved, because
# R2 objects are create-only and nothing deletes them; this is the sanity check that the assumption
# still holds. It needs no token and changes nothing. A failure means a stored variant went missing
# or changed outside the Worker: docs/technical/media-runbooks.md covers the repair.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-check
  cancel-in-progress: true

env:
  # actions/checkout runs `git init`, whose "default branch name" hint filled ten lines of every job's log.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - name: Download every variant production serves and compare it with main's
        run: bun run media:publish --verify --all
