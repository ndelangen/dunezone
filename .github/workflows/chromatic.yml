name: Chromatic

on:
  # main keeps the baselines current. Pull requests call this workflow from ci-pr.yml once every other
  # verify job has passed, so a failing run bills no snapshots; drafts never call it.
  push:
    branches: [main]
  workflow_call:
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    # A newer push to the same ref cancels the build in progress.
    concurrency:
      group: chromatic-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head commit, not GitHub's merge commit, so TurboSnap diffs against the branch's own
          # ancestors, and a re-run captures the commit its event named.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Enough history for TurboSnap to find an ancestor build without walking the full history.
          fetch-depth: 70
          persist-credentials: false
          sparse-checkout: |
            /*
            !/media/image/
          sparse-checkout-cone-mode: false
      - name: Require the Chromatic project token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo '::error::Set the CHROMATIC_PROJECT_TOKEN repository secret from Chromatic Manage > Configure.'
            exit 1
          fi
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          with-deps: "false"
      - name: Build and verify the public Storybook
        run: bun run verify:storybook-publication
      - name: Require the TurboSnap dependency graph
        run: test -s storybook-static/preview-stats.json
      - name: Publish and test in Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: bun run chromatic --storybook-build-dir=storybook-static --zip
