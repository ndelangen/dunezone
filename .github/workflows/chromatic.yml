name: Chromatic

on:
  # main keeps the baselines current. A pull request captures once it is ready for review and on each
  # later push, never while it is a draft: every build bills snapshots.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    # Fork pull requests get no token, so they get no build.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not GitHub's merge commit, so TurboSnap diffs against the branch's own ancestors.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/media/image/
          sparse-checkout-cone-mode: false
      - name: Require the Chromatic project token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo '::error::Set the CHROMATIC_PROJECT_TOKEN repository secret from Chromatic Manage > Configure.'
            exit 1
          fi
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          with-deps: "false"
      - name: Build and verify the public Storybook
        run: bun run verify:storybook-publication
      - name: Require the TurboSnap dependency graph
        run: test -s storybook-static/preview-stats.json
      - name: Publish and test in Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: bun run chromatic --storybook-build-dir=storybook-static --zip
