name: Repository security scorecard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scorecard.yml"
      - "scripts/normalize-scorecard-sarif*"
  schedule:
    - cron: "43 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Retain original repository findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-raw-${{ github.run_id }}
          path: scorecard.sarif
          retention-days: 14

  report:
    name: Publish Scorecard findings
    needs: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scorecard attestation permits only approved actions in the analysis job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/scorecard-raw
          skip-decompress: true
          digest-mismatch: error
      # The action's bundled ZIP extractor still calls the deprecated Buffer constructor.
      - name: Read the verified Scorecard archive
        env:
          SCORECARD_ARCHIVE_DIR: ${{ runner.temp }}/scorecard-raw
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path(os.environ['SCORECARD_ARCHIVE_DIR']).iterdir())
          if len(archives) != 1:
              raise ValueError('Expected one verified Scorecard archive')
          with ZipFile(archives[0]) as archive:
              if archive.namelist() != ['scorecard.sarif']:
                  raise ValueError('Expected only scorecard.sarif in the archive')
              Path('scorecard.sarif').write_bytes(archive.read('scorecard.sarif'))
          PYTHON
      - uses: ./.github/actions/setup
      - name: Normalize repository-wide finding locations
        run: node scripts/normalize-scorecard-sarif.ts scorecard.sarif scorecard.normalized.sarif
      - name: Retain repository findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-${{ github.run_id }}
          path: |
            scorecard.sarif
            scorecard.normalized.sarif
          retention-days: 14
      - name: Publish repository findings
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.normalized.sarif
          category: openssf-scorecard
