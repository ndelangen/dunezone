name: Repository security scorecard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scorecard.yml"
      - "scripts/normalize-scorecard-sarif*"
  schedule:
    - cron: "43 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: ./.github/actions/setup
      - name: Normalize repository-wide finding locations
        run: node scripts/normalize-scorecard-sarif.ts scorecard.sarif scorecard.normalized.sarif
      - name: Retain repository findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-${{ github.run_id }}
          path: |
            scorecard.sarif
            scorecard.normalized.sarif
          retention-days: 14
      - name: Publish repository findings
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.normalized.sarif
          category: openssf-scorecard
