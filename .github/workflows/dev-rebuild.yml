name: Rebuild dev deployment

# Rebuilds the long-lived cloud dev deployment from the anonymised, published-only snapshot (map #352, #1559).
# It never imports raw production: this job exports production, anonymises the export and loads only the result.
# Called by deploy-main after production has shipped, or dispatched manually to force fresh data.
on:
  workflow_call:
    inputs:
      base:
        description: Commit the change range is measured from; an empty value forces a rebuild.
        required: false
        type: string
    secrets:
      CONVEX_DEPLOY_KEY:
        description: Production deploy key; exports production for the anonymised snapshot dev is rebuilt from.
        required: true
      CONVEX_DEV_DEPLOY_KEY:
        description: Deploy key scoped to the dev deployment; pushes code and imports the snapshot.
        required: true
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the data even when no schema, migration or snapshot file changed.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dev-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The trigger decision diffs against the base commit deploy-main passes in.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Decide whether the data stage runs
        id: decision
        run: bun run ./scripts/dev-rebuild-decision.ts
        env:
          DEV_REBUILD_BASE: ${{ inputs.base }}
          DEV_REBUILD_HEAD: ${{ github.sha }}
          DEV_REBUILD_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      # Safe on its own when only application code changed, because an unchanged schema cannot be rejected by dev's existing data.
      # When the data is being rebuilt, the rebuild owns the push and orders it against the import.
      # On a migration-only merge the schema may still have narrowed through a validator it imports, so a refused push
      # there falls back to the rebuild below instead of failing the job.
      - name: Push main to the dev deployment
        id: push
        if: steps.decision.outputs.rebuild != 'true'
        continue-on-error: ${{ steps.decision.outputs.migrate == 'true' }}
        run: bun run provision dev --stage code
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}

      # Dev runs the migrations the merge added, as the deploy did on production, instead of exporting production again.
      # A failure or timeout here also falls back to the rebuild, which clears dev's migration state with its data.
      - name: Run the new migrations on dev's data
        id: migrate
        if: steps.decision.outputs.migrate == 'true' && steps.push.outcome == 'success'
        continue-on-error: true
        run: bun run provision dev --stage migrate
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}

      - name: Decide whether dev is rebuilt from a fresh export
        id: data
        run: echo "rebuild=${REBUILD}" >> "$GITHUB_OUTPUT"
        env:
          REBUILD: ${{ steps.decision.outputs.rebuild == 'true' || (steps.decision.outputs.migrate == 'true' && (steps.push.outcome == 'failure' || steps.migrate.outcome == 'failure')) }}

      # The snapshot job's own script, and the only step that holds the production key. It reads the raw export
      # into memory, deletes it before anonymising, and writes the scanned snapshot under RUNNER_TEMP.
      - name: Export production, anonymise it and scan the snapshot
        if: steps.data.outputs.rebuild == 'true'
        run: bun run ./scripts/anonymised-snapshot.ts
        env:
          CONVEX_PROD_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Rebuild dev from the anonymised snapshot
        if: steps.data.outputs.rebuild == 'true'
        run: bun run provision dev --stage data --snapshot-file "${RUNNER_TEMP}/anonymised-snapshot/snapshot.zip"
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}

      - name: Delete the snapshot from the runner
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/anonymised-snapshot"
