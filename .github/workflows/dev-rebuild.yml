name: Sync dev deployment

# Ordinary releases preserve dev data and migration progress.
# The weekly anonymised snapshot workflow owns data refreshes.
on:
  workflow_call:
    secrets:
      CONVEX_DEV_DEPLOY_KEY:
        description: Deploy key scoped to the dev deployment.
        required: true

permissions:
  contents: read

jobs:
  rebuild:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Refuse a stale release sync
        run: bun run scripts/production-snapshot-revision.ts --expect-current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A refused push or migration keeps its failure visible and never clears dev.
      - name: Sync code and outstanding migrations without resetting dev
        run: bun run provision dev --stage code --stage migrate
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
