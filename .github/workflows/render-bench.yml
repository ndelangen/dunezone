# Diagnostic for #1343: what each rendering setting of the Play table costs per frame on the CI runner's SwiftShader,
# measured in the verifier's own Chromium (full Chromium, new headless, --use-angle=swiftshader) against the hosted stack.
# It lives only on norbert/1343-render-bench, whose draft PR is closed unmerged, so it never becomes a required check.
name: Render bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: render-bench-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: github.head_ref == 'norbert/1343-render-bench'
    name: bench ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Three at a time, so other PRs' CI keeps the rest of the concurrent runners.
      max-parallel: 3
      matrix:
        repeat: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Record the runner CPU and start the samplers
        run: |
          out=test-results/hosted-play
          mkdir -p "$out"
          {
            lscpu
            echo "nproc: $(nproc)"
            free -m
          } | tee "$out/lscpu.txt"
          nohup vmstat -n -t 2 > "$out/vmstat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/samplers.pid"
          nohup bash -c 'while :; do echo "@ $(date -u +%s.%N)"; cat /proc/loadavg; top -b -H -n 2 -d 1 -w 250 -o %CPU | awk "/^top -/{f++} f==2" | sed -n "1,30p"; sleep 3; done' \
            > "$out/threads.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/samplers.pid"
      - name: Select full Chromium in new headless mode
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          "$chromium_path" --version | tee test-results/hosted-play/chromium-version.txt
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Run the bench flow
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow bench --browser "$CHROMIUM"
      - name: Summarise
        if: always()
        run: |
          xargs kill < "$RUNNER_TEMP/samplers.pid" 2>/dev/null || true
          {
            echo "### bench ${{ matrix.repeat }}: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
            echo '```'
            cat test-results/hosted-play/diagnostic-timing.jsonl 2>/dev/null || true
            grep -h '^BENCH frames' test-results/hosted-play/bench.log 2>/dev/null | cut -c1-2000 || echo "no bench output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bench evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-bench-${{ matrix.repeat }}
          path: test-results/hosted-play/**
          if-no-files-found: warn
          retention-days: 14
