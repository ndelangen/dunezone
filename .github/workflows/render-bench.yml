# Diagnostic for #1343: the regular and catalogue shards with the verifier's pages rendering the table
# without MSAA ("samples0"), and also at pixel ratio 0.75 ("samples0-dpr075"), beside an unchanged arm ("none"),
# with twice the flow budgets so a slow host's whole duration is measured.
# It lives only on norbert/1343-render-bench, whose draft PR is closed unmerged, so it never becomes a required check.
name: Render bench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: render-bench-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.head_ref == 'norbert/1343-render-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # Interleaved so each arm meets the same mix of runner hosts.
        run: |
          entries=''
          for repeat in 1 2; do
            for shard in regular catalogue; do
              for render in samples0 samples0-dpr075; do
                entries+="${entries:+,}{\"shard\":\"$shard\",\"render\":\"$render\",\"repeat\":$repeat}"
              done
            done
          done
          for shard in regular catalogue; do
            entries+=",{\"shard\":\"$shard\",\"render\":\"none\",\"repeat\":1}"
          done
          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"

  flows:
    needs: plan
    name: ${{ matrix.render }} ${{ matrix.shard }} ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # Four at a time, so other PRs' CI keeps the rest of the concurrent runners.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLOWS_RENDER: ${{ matrix.render }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/generated-images
      - uses: ./.github/actions/playwright-chromium
        with:
          # The ubuntu-24.04 runner image already ships Chromium's shared libraries.
          with-deps: "false"
      - name: Record the runner CPU and start the samplers
        run: |
          out=test-results/hosted-play
          mkdir -p "$out"
          {
            lscpu
            echo "nproc: $(nproc)"
            free -m
          } | tee "$out/lscpu.txt"
          nohup bash -c 'while :; do echo "@ $(date -u +%s.%N)"; cat /proc/loadavg; top -b -H -n 2 -d 1 -w 250 -o %CPU | awk "/^top -/{f++} f==2" | sed -n "1,30p"; sleep 3; done' \
            > "$out/threads.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/samplers.pid"
      - name: Select full Chromium in new headless mode
        run: |
          chromium_path="$(bun -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$chromium_path"
          "$chromium_path" --version | tee test-results/hosted-play/chromium-version.txt
          echo "CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Run the regular flow
        if: matrix.shard == 'regular'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow regular --browser "$CHROMIUM"
      - name: Run public-controls and battles
        if: matrix.shard == 'catalogue'
        run: bun --no-env-file scripts/verify-hosted-play-stack.ts --skip-generate --browser-only --flow public-controls --flow battles --browser "$CHROMIUM"
      - name: Summarise
        if: always()
        run: |
          xargs kill < "$RUNNER_TEMP/samplers.pid" 2>/dev/null || true
          {
            echo "### ${{ matrix.render }} ${{ matrix.shard }} ${{ matrix.repeat }}: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
            echo '```'
            cat test-results/hosted-play/diagnostic-timing.jsonl 2>/dev/null || echo "no timing recorded"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain flow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-flows-${{ matrix.render }}-${{ matrix.shard }}-${{ matrix.repeat }}
          path: test-results/hosted-play/**
          if-no-files-found: warn
          retention-days: 14
