name: Playwright Chromium
description: Install Chromium for Playwright with a version-keyed cache

inputs:
  with-deps:
    description: >-
      Also install OS shared libraries. "false" relies on the runner image already
      shipping them; Playwright validates at launch and fails fast if that changes.
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache Playwright Chromium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      run: npx playwright install ${{ inputs.with-deps == 'true' && '--with-deps' || '' }} chromium
      shell: bash
