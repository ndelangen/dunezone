name: Generated images
description: Restore generated image and vector variants from cache, encoding only what the cache lacks

inputs:
  regenerate-vectors:
    description: >-
      "true" runs the vector generator even on a cache hit. The generator also rewrites a media/vector
      source that is not pretty-printed, which a restored cache cannot, so the jobs that check the
      generators against the media or diff the renderer manifest pass "true".
    default: "false"

runs:
  using: composite
  steps:
    # Variants live in a content-addressed store (#1888 step 3): each is named after its original's SHA-256 and a hash
    # of its recipe and the encoder versions, so a name never changes meaning. The key names exactly what
    # generate:images reads: the raster lock (the originals are not in git, #1888 step 8), the rules, the generator and
    # the encoder sharp loads. A miss restores the closest earlier store, and the generator then encodes only the
    # variants that store lacks.
    - name: Name the variant store
      id: image_key
      run: |
        set -euo pipefail
        encoder="$(bun -e 'console.log(JSON.stringify(require("sharp").versions))' | sha256sum | cut -c1-16)"
        echo "prefix=media-variants-${encoder}-" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore the variant store
      id: image_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/media/local
        key: ${{ steps.image_key.outputs.prefix }}${{ hashFiles('media/raster.lock.json', 'src/shared/assetRules.ts', 'scripts/generate-images.ts', 'scripts/media-variants.ts') }}
        restore-keys: ${{ steps.image_key.outputs.prefix }}
    # A variant the store lacks is first downloaded from /m, where each production deploy publishes them, and kept
    # only when it matches the integrity headers it was served with. Only a variant still missing needs its original,
    # which the generator downloads from /__media/src and checks against the lock.
    - name: Generate image variants
      run: bun run generate:images --prune
      env:
        MEDIA_FILL_ORIGIN: https://dune.zone
      shell: bash
    # The vector output is reproducible from the same ingredients the renderer manifest hashes for it
    # (workers/publisher/renderer-manifest-build.ts), with svgo, svgpath and linkedom pinned by bun.lock.
    # The generator took about 14 s in every job that ran it.
    - name: Restore generated vectors
      id: vector_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: public/vector
        key: generated-vectors-${{ hashFiles('media/vector/**', 'src/shared/vectorRules.ts', 'src/shared/vectorNormalize.ts', 'scripts/generate-vectors.ts', 'bun.lock') }}
    - name: Generate vector variants
      if: steps.vector_cache.outputs.cache-hit != 'true' || inputs.regenerate-vectors == 'true'
      run: bun run generate:vectors
      shell: bash
