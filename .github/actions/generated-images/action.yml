name: Generated images
description: Restore generated image and vector variants from cache, regenerating either on a miss

inputs:
  regenerate-vectors:
    description: >-
      "true" runs the vector generator even on a cache hit. The generator also rewrites a media/vector
      source that is not pretty-printed, which a restored cache cannot, so the jobs that check the
      generators against the media or diff the renderer manifest pass "true".
    default: "false"

runs:
  using: composite
  steps:
    # The key names exactly what generate:images reads (#1923): the rasters under media/image and media/web,
    # the rules, the generator and the encoder sharp loads. media/image enters as its git tree hash, so a
    # job whose sparse checkout leaves the originals out still computes the same key. Vectors and the rest
    # of bun.lock stay out, because they do not change one generated byte.
    - name: Name the generated images
      id: image_key
      run: |
        set -euo pipefail
        tree="$(git rev-parse HEAD:media/image)"
        encoder="$(bun -e 'console.log(JSON.stringify(require("sharp").versions))' | sha256sum | cut -c1-16)"
        echo "key=generated-images-${tree}-${encoder}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore generated images
      id: image_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          public/image
          public/web
        key: ${{ steps.image_key.outputs.key }}-${{ hashFiles('media/web/**', 'src/shared/assetRules.ts', 'scripts/generate-images.ts') }}
    # A miss needs the original bytes, so a sparse checkout widens to the whole tree first. The checkout is
    # blobless, and git fetches the missing originals from the public repository as it writes them.
    - name: Check out the raster originals
      if: steps.image_cache.outputs.cache-hit != 'true'
      run: |
        if [ "$(git config --get core.sparseCheckout)" = "true" ]; then
          git sparse-checkout disable
        fi
      shell: bash
    - name: Generate image variants
      if: steps.image_cache.outputs.cache-hit != 'true'
      run: bun run generate:images
      shell: bash
    # The vector output is reproducible from the same ingredients the renderer manifest hashes for it
    # (workers/publisher/renderer-manifest-build.ts), with svgo, svgpath and linkedom pinned by bun.lock.
    # The generator took about 14 s in every job that ran it.
    - name: Restore generated vectors
      id: vector_cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: public/vector
        key: generated-vectors-${{ hashFiles('media/vector/**', 'src/shared/vectorRules.ts', 'src/shared/vectorNormalize.ts', 'scripts/generate-vectors.ts', 'bun.lock') }}
    - name: Generate vector variants
      if: steps.vector_cache.outputs.cache-hit != 'true' || inputs.regenerate-vectors == 'true'
      run: bun run generate:vectors
      shell: bash
