services:
  backend:
    # The backend and dashboard share the 2026-10-06 a3538c6 release used by the native flow runner.
    image: ghcr.io/get-convex/convex-backend:latest@sha256:d3338c4a78b622aa4d8b8ed6cdb114d8f7610efc91cdf61769c39314b79bb881
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${CONVEX_BACKEND_PORT:-3210}:3210"
      - "127.0.0.1:${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex_local_e2e_data:/convex/data
    environment:
      - ACTIONS_USER_TIMEOUT_SECS
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      - APPLICATION_MAX_CONCURRENT_QUERIES=${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_S3_DISABLE_CHECKSUMS
      - AWS_S3_DISABLE_SSE
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${CONVEX_BACKEND_PORT:-3210}}
      - CONVEX_RELEASE_VERSION_DEV
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${CONVEX_SITE_PORT:-3211}}
      - DATABASE_URL
      - DATABASE_UDF_USER_TIMEOUT_SECONDS
      - DISABLE_BEACON
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - MYSQL_URL
      - POSTGRES_URL
      - REDACT_LOGS_TO_CLIENT
      - RUST_BACKTRACE
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    # Update the dashboard and backend digests together.
    image: ghcr.io/get-convex/convex-dashboard:latest@sha256:6320593f529ab6210d4da473c7f84e491e5d6adbd86c26fb5cc3001c6c32ae42
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${CONVEX_BACKEND_PORT:-3210}}
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY
    depends_on:
      backend:
        condition: service_healthy

  site-loopback:
    # OIDC discovery inside the backend must reach the same mapped site origin that issued the token.
    image: ghcr.io/get-convex/convex-dashboard:latest@sha256:6320593f529ab6210d4da473c7f84e491e5d6adbd86c26fb5cc3001c6c32ae42
    profiles:
      - worktree-local
    network_mode: service:backend
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      - CONVEX_SITE_PORT=${CONVEX_SITE_PORT:-3211}
    entrypoint:
      - /usr/bin/node
      - -e
      - |
        const net = require('node:net');
        const listenPort = Number(process.env.CONVEX_SITE_PORT);
        const stop = () => process.exit(0);
        process.once('SIGINT', stop);
        process.once('SIGTERM', stop);
        if (listenPort === 3211) {
          setInterval(() => undefined, 60_000);
        } else {
          net
            .createServer((client) => {
              const upstream = net.connect(3211, '127.0.0.1');
              client.pipe(upstream).pipe(client);
              client.on('error', () => upstream.destroy());
              upstream.on('error', () => client.destroy());
            })
            .on('error', (error) => {
              console.error('Site loopback proxy failed on port', listenPort, error);
              process.exit(1);
            })
            .listen(listenPort, '127.0.0.1');
        }
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex_local_e2e_data:
