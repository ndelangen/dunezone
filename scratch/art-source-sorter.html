<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art source sorter</title>
<style>
  :root { --bg:#17140f; --panel:#221d16; --line:#4a3f2e; --text:#efe6d2; --dim:#a89b80; --gold:#e9c46a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .bar { flex:1; min-width:160px; height:8px; background:var(--panel); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--gold); width:0; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .stage { height:min(56vh,520px); display:flex; align-items:center; justify-content:center; border-radius:10px;
    background: repeating-conic-gradient(#e8dfcc 0 25%, #d8cdb6 0 50%) 0 0/24px 24px; }
  .stage img { max-width:96%; max-height:96%; object-fit:contain; }
  .meta { margin:12px 0; }
  .path { font-family:ui-monospace, monospace; color:var(--gold); word-break:break-all; }
  .dim { color:var(--dim); }
  .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  .choices button { padding:16px 10px; font-size:17px; font-weight:600; }
  .choices button kbd { display:block; font-size:12px; color:var(--dim); font-weight:400; }
  .choices button.on { border-color:var(--gold); background:#3a3020; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label { display:flex; gap:6px; align-items:center; }
  .counts span { margin-right:14px; }
  .done { text-align:center; padding:40px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--gold); color:#17140f; padding:8px 14px; border-radius:6px; display:none; }
  @media (max-width:560px){ .choices { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Art source sorter</h1>
  <div class="bar"><i id="bar"></i></div>
  <span id="progress" class="dim"></span>
  <button id="copy">Copy prompt for Claude</button>
</header>
<main>
  <div class="row">
    <label><input type="checkbox" id="onlyUnknown"> Only files without a recorded artist</label>
    <label>Folder <select id="folder"><option value="">All folders</option></select></label>
    <label><input type="checkbox" id="skipSorted" checked> Skip files I already sorted</label>
  </div>
  <div id="card"></div>
  <p class="counts dim" id="counts"></p>
  <p class="dim">Keys: 1 GF9, 2 online somewhere, 3 purely generated, ← back, → skip. Your choices are saved in this browser.</p>
  <div class="row"><button id="reset">Clear all choices</button></div>
</main>
<div class="toast" id="toast">Prompt copied</div>

const GROUPS = [['gf9','GF9'],['online','Online somewhere'],['generated','Purely generated']];
const KEY = 'art-source-sorter-v1';
let choices = {};
try { choices = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(choices)); } catch {} };
const folderOf = p => p.slice(0, p.lastIndexOf('/') + 1);
const folders = [...new Set(ROWS.map(r => folderOf(r[0])))];
const sel = document.getElementById('folder');
for (const f of folders) { const o = document.createElement('option'); o.value = f; o.textContent = f + ' (' + ROWS.filter(r => folderOf(r[0]) === f).length + ')'; sel.append(o); }
const $ = id => document.getElementById(id);
let list = [], pos = 0, history = [];
function filtered() {
  return ROWS.filter(([p,, , credit]) => (!$('onlyUnknown').checked || credit.startsWith('Artist not yet recorded'))
    && (!sel.value || folderOf(p) === sel.value));
}
function rebuild() {
  list = filtered(); pos = 0; history = [];
  if ($('skipSorted').checked) advanceToUnsorted();
  render();
}
function advanceToUnsorted() { while (pos < list.length && choices[list[pos][0]]) pos++; }
function render() {
  const sorted = list.filter(r => choices[r[0]]).length;
  $('bar').style.width = (list.length ? 100 * sorted / list.length : 0) + '%';
  $('progress').textContent = sorted + ' / ' + list.length + ' sorted';
  const total = Object.values(choices);
  $('counts').innerHTML = GROUPS.map(([k, l]) => '<span>' + l + ': ' + total.filter(v => v === k).length + '</span>').join('');
  const card = $('card');
  if (pos >= list.length) { card.innerHTML = '<div class="done"><h2>All done here</h2><p class="dim">Copy the prompt and paste it to Claude in the art credits thread.</p></div>'; return; }
  const [p, url, desc, credit] = list[pos];
  card.innerHTML = '<div class="stage"><img alt="" src="https://dune.zone' + url + '"></div>'
    + '<div class="meta"><div class="path"></div><div class="desc"></div><div class="dim credit"></div></div>'
    + '<div class="choices">' + GROUPS.map(([k, l], i) => '<button data-k="' + k + '"' + (choices[p] === k ? ' class="on"' : '') + '>' + l + '<kbd>' + (i + 1) + '</kbd></button>').join('') + '</div>'
    + '<div class="row"><button id="back">← Back</button><button id="skip">Skip →</button><span class="dim">' + (pos + 1) + ' of ' + list.length + '</span></div>';
  card.querySelector('.path').textContent = p;
  card.querySelector('.desc').textContent = desc;
  card.querySelector('.credit').textContent = 'Current credit: ' + credit;
  card.querySelectorAll('.choices button').forEach(b => b.onclick = () => choose(b.dataset.k));
  $('back').onclick = back; $('skip').onclick = skip;
}
function choose(k) { choices[list[pos][0]] = k; save(); history.push(pos); pos++; if ($('skipSorted').checked) advanceToUnsorted(); render(); }
function skip() { history.push(pos); pos++; render(); }
function back() { if (history.length) pos = history.pop(); else if (pos > 0) pos--; render(); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (pos < list.length && ['1','2','3'].includes(e.key)) choose(GROUPS[+e.key - 1][0]);
  else if (e.key === 'ArrowLeft') back();
  else if (e.key === 'ArrowRight' && pos < list.length) skip();
});
function prompt() {
  const lines = ['Art source sorting from the art source sorter. Use it to update the art credits: "GF9" files are Gale Force Nine artwork, "Online somewhere" files need a reverse image search to find their source, "Purely generated" files were made with AI for Dune Zone. Files are listed by folder.', ''];
  for (const [k, l] of GROUPS) {
    const byFolder = {};
    for (const [p, v] of Object.entries(choices)) if (v === k) (byFolder[folderOf(p)] ??= []).push(p.slice(folderOf(p).length));
    const n = Object.values(byFolder).reduce((a, b) => a + b.length, 0);
    lines.push('## ' + l + ' (' + n + ')');
    for (const f of Object.keys(byFolder).sort()) lines.push(f + ': ' + byFolder[f].sort().join(', '));
    lines.push('');
  }
  return lines.join('\n');
}
$('copy').onclick = async () => {
  const text = prompt();
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  $('toast').style.display = 'block'; setTimeout(() => $('toast').style.display = 'none', 1500);
};
$('reset').onclick = () => { if (confirm('Clear every choice?')) { choices = {}; save(); rebuild(); } };
$('onlyUnknown').onchange = rebuild; sel.onchange = rebuild; $('skipSorted').onchange = rebuild;
rebuild();
</script>
